---
# The generated reference, published to GitHub Pages: every collection's modules, plugins and
# roles (antsibull-docs, Sphinx) and the Python API (pdoc), built from the code by `just docs`
# (tools/docs.py) on each push to main. Nothing generated is committed. The repository's Pages
# source must be "GitHub Actions" (Settings, Pages).
name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: The tool's venv
        run: |
          python3 -m venv venv
          ./venv/bin/pip install -q -r requirements.txt
          for r in collections/ansible_collections/*/*/requirements.txt; do
            ./venv/bin/pip install -q -r "$r"
          done
          ./venv/bin/ansible-galaxy collection install -r requirements.yml -p .collections
      - name: The reference (the pinned doc tools, their own venv)
        run: |
          ./venv/bin/python tools/docs.py build
          rm -rf .build/docs/rst          # Sphinx's input, not part of the site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .build/docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
