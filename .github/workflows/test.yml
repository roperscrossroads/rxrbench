---
# The bench on a PC, in CI (docs/SIMULATED.md). Five jobs: the unit tests and lint (the docs'
# too) on every push; the container sims (Linux devices, stock Meshtastic); the mesh sims (zephyrtastic
# built for native_sim from its own public, pinned workspace); the simulated Zephyr bench
# (Zephyr's shell sample built for native_sim, two boards behind real brokers, planned, flashed
# and tested), once per Zephyr release in west-zephyr-<version>.yml; and, where the runner has
# QEMU, the whole thing on the simulated bench host.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NUTTX_TAG: nuttx-12.13.0

jobs:
  # What a pull request needs (tools/select_tests.py, from the files it changed): the jobs below
  # run on a push and by hand every time, and on a pull request only when the selection takes one
  # of their test files (ALL takes every job). Needs only PyYAML: it runs in seconds.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - id: select
        run: |
          sel=ALL
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 -m pip install -q pyyaml
            sel=$(python3 tools/select_tests.py "origin/${{ github.base_ref }}..HEAD")
          fi
          printf '%s\n' "$sel"
          { echo "tests<<EOF"; printf '%s\n' "$sel"; echo EOF; } >> "$GITHUB_OUTPUT"
      # The CI image built from this checkout's requirements (ci/image/README.md), when there is
      # one; none (a pull request that changes them, before its image is built) means the unit
      # job installs them itself, as it always did.
      - id: image
        run: |
          ref="ghcr.io/roperscrossroads/rxrbench-ci:req-$(ci/image/requirements-key)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "image=$ref" >> "$GITHUB_OUTPUT"; echo "the unit job runs in $ref"
          else
            echo "no $ref yet: the unit job installs its requirements"
          fi

  unit:
    runs-on: ubuntu-24.04
    needs: changes
    permissions:
      contents: read
      packages: read
    # the CI image when there is one for these requirements (an empty image runs on the host)
    container:
      image: ${{ needs.changes.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0     # a pull request's tests are chosen from what it changed against its base
      - if: needs.changes.outputs.image == ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: The tool's venv, from the CI image
        if: needs.changes.outputs.image != ''
        run: |
          ln -sfn /opt/venv venv
          ln -sfn /opt/collections .collections
          mkdir -p .build && ln -sfn /opt/docs-venv .build/docs-venv
      - name: The tool's venv
        if: needs.changes.outputs.image == ''
        run: |
          # devreg runs under the machine's own python3, as on a bench host: it needs PyYAML there
          python3 -m pip install -q pyyaml
          python3 -m venv venv
          # just (pinned, as the mesh-sim job's): the README's commands table is checked against it
          ./venv/bin/pip install -q -r requirements.txt rust-just==1.45.0
          for r in collections/ansible_collections/*/*/requirements.txt; do
            ./venv/bin/pip install -q -r "$r"
          done
          ./venv/bin/ansible-galaxy collection install -r requirements.yml -p .collections
      - name: Unit tests (on a pull request, those its changes need; everything on a push)
        run: |
          sel=ALL
          if [ "${{ github.event_name }}" = pull_request ]; then
            sel=$(./venv/bin/python tools/select_tests.py "origin/${{ github.base_ref }}..HEAD")
          fi
          if [ "$sel" = ALL ]; then
            ./venv/bin/pytest -q -rs -n auto --dist loadfile tests/unit
          else
            unit=$(printf '%s\n' "$sel" | grep '^tests/unit/' || true)
            echo "selected: $(printf '%s\n' "$unit" | grep -c . || true) unit test files"
            if [ -n "$unit" ]; then ./venv/bin/pytest -q -rs -n auto --dist loadfile $unit; fi
          fi
      - name: Core alone, without the bundled plugins (core-portability P1)
        run: ./venv/bin/python tools/core_only.py -rs -n auto --dist loadfile
      - name: Lint
        run: |
          ./venv/bin/yamllint -s .
          ./venv/bin/ansible-lint
          ./venv/bin/python tools/privacy_check.py
          ./venv/bin/python tools/features.py --check
      - name: The docs as antsibull-docs reads them (the pinned doc tools, their own venv)
        # ansible-lint passes a DOCUMENTATION it cannot read; this fails it, and a markup or
        # argument spec antsibull-docs would render wrong
        run: ./venv/bin/python tools/docs.py lint

  containers:
    # The simulated benches that need only Docker: Linux devices as containers with an ssh
    # server (the Linux plugin), and stock Meshtastic's own Linux build with its simulated radio,
    # configured over its network API (the mesh plugin's simmt). A skip is a failure here: a
    # sim that did not run tested nothing.
    runs-on: ubuntu-24.04
    needs: [unit, changes]
    if: >-
      contains(needs.changes.outputs.tests, 'ALL')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_linux_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_meshtastic_stock_sim.py')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: The tool's venv
        run: |
          python3 -m pip install -q pyyaml
          python3 -m venv venv
          ./venv/bin/pip install -q -r requirements.txt
          for r in collections/ansible_collections/*/*/requirements.txt; do
            ./venv/bin/pip install -q -r "$r"
          done
          ./venv/bin/ansible-galaxy collection install -r requirements.yml -p .collections
      - name: The pinned tools the secrets tests use (sops, age)
        run: |
          ./venv/bin/python tools/pins.py install sops age
          echo "$HOME/.local/share/rxrbench/bin" >> "$GITHUB_PATH"
      - name: The pinned stock Meshtastic image
        run: ./venv/bin/python collections/ansible_collections/rxrbench/mesh/sim/stock/simmt.py pull
      - name: The container sims
        run: |
          ./venv/bin/pytest -q -rs tests/sim/test_linux_sim.py tests/sim/test_meshtastic_stock_sim.py \
            | tee sims.out
          # pytest's own summary line, not the logs above it (which say "skipping" of tasks)
          if tail -n 1 sims.out | grep -qE "[0-9]+ skipped"; then
            echo "a container sim was skipped"; exit 1
          fi

  mesh-sim:
    # The mesh plugin on simulated boards: zephyrtastic (a public Zephyr firmware) built for
    # native_sim from its own manifest, at a pinned commit, with the Zephyr patches it carries
    # (west patch apply), then the sim boards behind real brokers: plan, apply, secrets, a family
    # of images. zephcore's sims (and the family switch, which needs it) have no public firmware
    # and run on a workstation only. A skip here is a failure.
    runs-on: ubuntu-24.04
    # Zephyr's SDK (Arm), the native_sim and QEMU host tools and uv's Python come with the image
    # (github.com/roperscrossroads/images, images/zephyr-arm), pinned by digest; the job runs as
    # root in it, so nothing here needs sudo, setup-python or a toolchain download.
    container:   # zephyr-arm:20261114
      image: ghcr.io/roperscrossroads/zephyr-arm@sha256:12405ab544fbde5128dfe4286cbeb63f2a97ad625bffa3d0ef8ee084b325381e
    needs: [unit, changes]
    if: >-
      contains(needs.changes.outputs.tests, 'ALL')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_sim_board.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_managed_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_secrets_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_sim_layout.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_sim_flash.py')
    env:
      ZEPHYRTASTIC_REV: 1117570e96cc3b18b175b57ba1057800a2d47edb   # the build the bench runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: rxrbench
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: roperscrossroads/zephyrtastic
          ref: ${{ env.ZEPHYRTASTIC_REV }}
          path: zephyrtastic
      - name: HOME as root's own (GitHub sets /github/home in a container; see the sim job)
        run: echo "HOME=/root" >> "$GITHUB_ENV"
      - name: zephyrtastic's Zephyr workspace (its own manifest; native_sim needs no vendor HAL)
        run: |
          # west and Zephyr's Python requirements in a venv on PATH for the later steps (the
          # build finds Zephyr's Python there too)
          uv venv -q --python 3.12 --seed "$GITHUB_WORKSPACE/.venv-west"
          "$GITHUB_WORKSPACE/.venv-west/bin/pip" install -q west
          echo "$GITHUB_WORKSPACE/.venv-west/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.venv-west/bin:$PATH"
          west init -l zephyrtastic
          west config manifest.project-filter -- -hal_espressif,-hal_nordic,-hal_stm32,-hal_xtensa
          # --narrow fetches each project's pinned revision itself (a shallow fetch of the branch
          # tips can miss a module pinned behind its branch's tip)
          west update --narrow -o=--depth=1
          # Zephyr's base requirements, and nanopb's (grpcio-tools: the protoc its generator runs)
          pip install -q -r zephyr/scripts/requirements-base.txt -r modules/lib/nanopb/extra/requirements.txt
          west zephyr-export
      - name: The Zephyr patches zephyrtastic carries
        working-directory: zephyrtastic
        run: west patch apply
      - name: Under act (just ci mesh-sim) the tool is the workspace itself, not checked out into it
        if: ${{ env.ACT }}
        run: "[ -e rxrbench ] || ln -s . rxrbench"
      - name: The tool's venv, just, sops and age
        working-directory: rxrbench
        run: |
          uv venv -q --python 3.12 --seed venv
          ./venv/bin/pip install -q -r requirements.txt rust-just==1.45.0
          for r in collections/ansible_collections/*/*/requirements.txt; do
            ./venv/bin/pip install -q -r "$r"
          done
          ./venv/bin/ansible-galaxy collection install -r requirements.yml -p .collections
          ./venv/bin/python tools/pins.py install sops age
          echo "$HOME/.local/share/rxrbench/bin" >> "$GITHUB_PATH"
      - name: The sim boards, class 0 and class 90 (a site that says only where the source is)
        working-directory: rxrbench
        run: |
          site="$RUNNER_TEMP/ci-site"; mkdir -p "$site/catalog"
          printf 'sources:\n  zephyrtastic: {tree: %s/zephyrtastic, workspace: %s}\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > "$site/catalog/firmware.yml"
          RXRBENCH_SITE="$site" ./venv/bin/just sim-build zephyrtastic 0
          RXRBENCH_SITE="$site" ./venv/bin/just sim-build zephyrtastic 90
      - name: The mesh sims
        working-directory: rxrbench
        run: |
          set -o pipefail
          # the one test of these that needs zephcore (no public source) is left out by name, so
          # that any other skip still fails the job
          ./venv/bin/pytest -q -rs -n auto --dist loadfile tests/sim/test_sim_board.py tests/sim/test_managed_sim.py \
            tests/sim/test_secrets_sim.py tests/sim/test_sim_layout.py tests/sim/test_sim_flash.py \
            --deselect tests/sim/test_secrets_sim.py::test_a_key_a_board_made_is_escrowed_compared_and_never_shown \
            | tee sims.out
          if tail -n 1 sims.out | grep -qE "[0-9]+ skipped"; then
            echo "a mesh sim was skipped"; exit 1
          fi

  sim:
    runs-on: ubuntu-24.04
    needs: [unit, changes]
    if: >-
      contains(needs.changes.outputs.tests, 'ALL')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_zephyr_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_zephyr_app_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_mcumgr_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_nuttx_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_qemu_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_core_only_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_run_state_sim.py')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_campaign_sim.py')
    strategy:
      fail-fast: false
      matrix:
        # 4.5.0 is what the workstation's sim images are built from (and what `vm` takes);
        # 4.4.1 the previous release, where the emulated MCU's tests skip (test_qemu_sim.py)
        zephyr: ["4.5.0", "4.4.1"]
    # Zephyr's SDK (Arm), the native_sim and QEMU host tools and uv's Python come with the image
    # (github.com/roperscrossroads/images, images/zephyr-arm), pinned by digest; the job runs as
    # root in it, so nothing here needs sudo, setup-python or a toolchain download.
    container:   # zephyr-arm:20261114
      image: ghcr.io/roperscrossroads/zephyr-arm@sha256:12405ab544fbde5128dfe4286cbeb63f2a97ad625bffa3d0ef8ee084b325381e
    defaults:
      run:
        working-directory: rxrbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: rxrbench
      - name: Where the workspaces are
        # the west workspace is the job's directory, the tool checked out inside it; set here, not
        # with ${{ github.workspace }}, which in a container job names the runner's path, not the
        # container's
        run: |
          echo "RXRBENCH_ZEPHYR_WORKSPACE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "RXRBENCH_NUTTX_WORKSPACE=$GITHUB_WORKSPACE/nuttx-ws" >> "$GITHUB_ENV"
          # GitHub gives a container job HOME=/github/home, but root's home is /root: Ansible
          # expands a bench host's ~ from the user's entry (/root), a module from HOME, and an
          # image staged in one ~ would not be found in the other
          echo "HOME=/root" >> "$GITHUB_ENV"
      # The built images, from the cache when nothing they are built from has changed: the west
      # manifest, the NuttX release, the build tools, the boards' configurations and this file.
      # The tests need only the images (and the MCUmgr venv, sops and age), so a hit skips the
      # workspace and every build below. Only a push to main writes the cache;
      # a pull request reads it (a public repo's untrusted change never feeds a trusted run).
      - name: The built sim images, when nothing they are built from has changed
        id: images
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            rxrbench/.build/store/zephyr
            rxrbench/.build/store/nuttx
          key: >-
            sim-images-v1-z${{ matrix.zephyr }}-${{ env.NUTTX_TAG }}-${{ hashFiles(
            'rxrbench/west-zephyr-*.yml', 'rxrbench/tools/zephyr_sim.py', 'rxrbench/tools/zephyr_qemu.py',
            'rxrbench/collections/ansible_collections/rxrbench/core/sim/zephyr/**',
            'rxrbench/collections/ansible_collections/rxrbench/zephyr/sim/**',
            'rxrbench/collections/ansible_collections/rxrbench/nuttx/tools/**',
            'rxrbench/collections/ansible_collections/rxrbench/nuttx/sim/**',
            'rxrbench/.github/workflows/test.yml') }}
      - name: A Zephyr to build the boards from (west, the modules; imgtool for sysbuild's signing)
        if: steps.images.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          uv venv -q --python 3.12 --seed "$GITHUB_WORKSPACE/.venv-west"
          "$GITHUB_WORKSPACE/.venv-west/bin/pip" install -q west
          echo "$GITHUB_WORKSPACE/.venv-west/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.venv-west/bin:$PATH"
          west init -l rxrbench --mf "west-zephyr-${{ matrix.zephyr }}.yml"
          # --narrow fetches each project's pinned revision itself: a shallow fetch of the branch
          # tips misses a module pinned to a commit its branch has moved past (zcbor in 4.5.0)
          west update --narrow -o=--depth=1
          # Zephyr's Python requirements before its west commands: zephyr-export imports jsonschema
          pip install -q -r zephyr/scripts/requirements-base.txt \
            -r bootloader/mcuboot/scripts/requirements.txt
          west zephyr-export
      - name: The tool's venv
        run: |
          # devreg runs under the machine's own python3, as on a bench host (the image's has PyYAML)
          uv venv -q --python 3.12 --seed venv
          ./venv/bin/pip install -q -r requirements.txt
          for r in collections/ansible_collections/*/*/requirements.txt; do
            ./venv/bin/pip install -q -r "$r"
          done
          ./venv/bin/ansible-galaxy collection install -r requirements.yml -p .collections
      - name: What this machine has of what the benches need (docs/GETTING-STARTED.md#requirements)
        if: steps.images.outputs.cache-hit != 'true'
        run: ./venv/bin/python tools/doctor.py --require zephyr,qemu
      - name: The simulated boards
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          ./venv/bin/python tools/zephyr_sim.py build --name zephyr-shell \
            --app zephyr/samples/subsys/shell/shell_module
          ./venv/bin/python tools/zephyr_sim.py build --name zephyr-shell-b \
            --app zephyr/samples/subsys/shell/shell_module \
            --conf collections/ansible_collections/rxrbench/core/sim/zephyr/prompt-b.conf
      - name: The SMP server, signed as MCUboot images at two versions (MCUmgr on native_sim)
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          c=collections/ansible_collections/rxrbench/core/sim/zephyr
          app=zephyr/samples/subsys/mgmt/mcumgr/smp_svr
          ./venv/bin/python tools/zephyr_sim.py build --name zsmp --app $app --conf $c/smp-shell.conf \
            --overlay $c/big-flash.overlay --family zephyr_mcumgr --sign 1.0.0
          ./venv/bin/python tools/zephyr_sim.py build --name zsmp-b --app $app --conf $c/smp-shell.conf \
            --conf $c/zsmp-b.conf --overlay $c/big-flash.overlay --family zephyr_mcumgr --sign 1.1.0
      - name: The MCUmgr client venv the SMP module runs with (hosts-install makes it on a bench host)
        run: |
          uv venv -q --python 3.12 --seed "$HOME/.venv-mcumgr"
          "$HOME/.venv-mcumgr/bin/pip" install -q \
            -r collections/ansible_collections/rxrbench/core/host/venvs/mcumgr.txt
      - name: NuttX, its apps and its sim board at two builds (the nuttx plugin's board)
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          w="$RXRBENCH_NUTTX_WORKSPACE"; u=https://github.com/apache; mkdir -p "$w"   # upstream (privacy: allow)
          git clone -q --depth 1 -b "$NUTTX_TAG" "$u/nuttx" "$w/nuttx"
          git clone -q --depth 1 -b "$NUTTX_TAG" "$u/nuttx-apps" "$w/apps"
          python3 -m venv "$w/.venv" && "$w/.venv/bin/pip" install -q kconfiglib
          n=collections/ansible_collections/rxrbench/nuttx/tools/nuttx_sim.py
          ./venv/bin/python "$n" build --name nsh
          ./venv/bin/python "$n" build --name nsh-b --set 'CONFIG_NSH_PROMPT_STRING="nsh-b> "'
      - name: The zephyr plugin's application, at three versions
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          z=collections/ansible_collections/rxrbench/zephyr/sim
          for v in 1.0 1.1 2.0; do
            ./venv/bin/python tools/zephyr_sim.py build --name zapp-$v --app $z/zapp --conf $z/zephyr/zapp-$v.conf
          done
      - name: The emulated MCU's images (the SMP server under MCUboot on the MPS2 AN385, two versions)
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          c=collections/ansible_collections/rxrbench/core/sim/zephyr
          app=zephyr/samples/subsys/mgmt/mcumgr/smp_svr
          ./venv/bin/python tools/zephyr_qemu.py build --name zq --app $app --conf $c/smp-shell-mcu.conf \
            --version 1.0.0
          ./venv/bin/python tools/zephyr_qemu.py build --name zq-b --app $app --conf $c/smp-shell-mcu.conf \
            --conf $c/zq-b.conf --version 2.0.0
      - name: sops and age, for the encrypted store the secrets test uses (pinned, checksummed)
        run: |
          ./venv/bin/python tools/pins.py install sops age
          ./venv/bin/python tools/pins.py path >> "$GITHUB_PATH"
      - name: Everything the seven sim files need is there
        if: steps.images.outputs.cache-hit != 'true'
        run: ./venv/bin/python tools/doctor.py --require zephyr,qemu,nuttx,smp,secrets
      - name: Every image the tests need came from the cache (a partial cache must not make them skip)
        if: steps.images.outputs.cache-hit == 'true'
        run: |
          for n in zephyr/zephyr-shell zephyr/zephyr-shell-b zephyr/zsmp zephyr/zsmp-b zephyr/zapp-1.0 \
                   zephyr/zapp-1.1 zephyr/zapp-2.0 zephyr/zq zephyr/zq-b nuttx/nsh nuttx/nsh-b; do
            ls .build/store/$n/* >/dev/null || { echo "missing from the cache: $n"; exit 1; }
          done
      - name: Keep the built images (a push to main only)
        if: steps.images.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            rxrbench/.build/store/zephyr
            rxrbench/.build/store/nuttx
          key: ${{ steps.images.outputs.cache-primary-key }}
      - name: The simulated Zephyr bench, and what a device keeps
        run: >-
          ./venv/bin/pytest -q -rs -n auto --dist loadfile tests/sim/test_zephyr_sim.py tests/sim/test_zephyr_app_sim.py
          tests/sim/test_mcumgr_sim.py tests/sim/test_nuttx_sim.py tests/sim/test_qemu_sim.py
          tests/sim/test_core_only_sim.py tests/sim/test_run_state_sim.py tests/sim/test_campaign_sim.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: sim-images-${{ matrix.zephyr }}
          path: rxrbench/.build/store          # Zephyr and NuttX: vm's layout has boards of both
          retention-days: 7

  vm:
    runs-on: ubuntu-24.04
    needs: [sim, changes]
    if: >-
      contains(needs.changes.outputs.tests, 'ALL')
      || contains(needs.changes.outputs.tests, 'tests/sim/test_vmhost.py')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sim-images-4.5.0
          path: .build/store
      # GitHub's Linux runners expose /dev/kvm, but only root may open it until a udev rule
      # opens it up; without it the simulated host boots under TCG, several times slower.
      - name: KVM for QEMU
        run: |
          if [ -e /dev/kvm ] && [ ! -w /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"
      - name: The tool's venv, and QEMU
        run: |
          # devreg runs under the machine's own python3, as on a bench host: it needs PyYAML there
          python3 -m pip install -q pyyaml
          python3 -m venv venv
          ./venv/bin/pip install -q -r requirements.txt
          for r in collections/ansible_collections/*/*/requirements.txt; do
            ./venv/bin/pip install -q -r "$r"
          done
          ./venv/bin/ansible-galaxy collection install -r requirements.yml -p .collections
          chmod +x .build/store/zephyr/*/zephyr.exe .build/store/nuttx/*/nuttx   # artifacts drop the mode
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils
          ls -l /dev/kvm || echo "no KVM: the host boots under TCG"
      # The cloud image (~600 MB) is pinned by release in vmhost.py: cached under that file's hash,
      # so a run downloads it only when the pin moves.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/rxrbench/vmhost/base.img
          key: vmhost-base-${{ hashFiles('collections/ansible_collections/rxrbench/core/sim/vmhost.py') }}
      - name: The simulated bench host's image
        run: ./venv/bin/python collections/ansible_collections/rxrbench/core/sim/vmhost.py setup
      - name: The whole bench on the simulated host
        run: ./venv/bin/pytest -q -rs tests/sim/test_vmhost.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: vmhost-logs
          path: ~/.cache/rxrbench/vmhost/run
          retention-days: 7
