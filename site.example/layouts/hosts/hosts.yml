---
# The bench hosts themselves, with no boards: for verbs that act on a host's hardware as a
# whole (`just survey`, `just hosts-install`) and for the plug relay, which reads its host list
# and ssh users from here. Copy to <site>/layouts/hosts/ and name your own hosts.
all:
  children:
    bench_hosts:
      vars:
        # the example's bench-host user, and the venv the modules run in (the mesh plugin's,
        # for mesh boards; ~/.venv-bench where there are none: layouts/example says why)
        ansible_user: bench
        ansible_python_interpreter: /home/bench/.venv-mesh/bin/python
      hosts:
        bench1: {ansible_host: bench1}
        # The simulated bench host (docs/SIMULATED.md): `just sim-host-up`, then
        # `just hosts-install vmhost1`. Its keys are what core's sim/vmhost.py setup made.
        vmhost1:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: bench
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: ~/.cache/rxrbench/vmhost/id_ed25519
          ansible_ssh_common_args: "-o UserKnownHostsFile=~/.cache/rxrbench/vmhost/known_hosts"
    # One machine that is both (a Raspberry Pi with the boards plugged into it): make it the
    # only bench host, run in place, and the only workstation (which gives it the plug relay):
    #   bench_hosts:  pi1: {ansible_connection: local, ansible_user: <you>,
    #                       ansible_python_interpreter: /home/<you>/.venv-mesh/bin/python}
    #   workstations: pi1: {}
    # and in the registry `pi1: {local: true}`.
    # The workstation that runs rxrbench (and the plug relay) gets the default install too.
    workstations:
      hosts:
        workstation:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
