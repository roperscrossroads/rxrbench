---
# simlinux: Linux devices that are containers. Two devices of family `linux` (an ssh server
# and a BusyBox userland, see the Linux plugin's sim/) on this machine. It brings its own
# registry and catalog. Start it with `just sim-linux-up`; the tool then treats it like any
# other layout.
plugin: rxrbench.core.devreg
layers: [simlinux]
registry: ../../../collections/ansible_collections/rxrbench/linux/sim/registry.yaml
catalog_dir: ../../../collections/ansible_collections/rxrbench/linux/sim/catalog
rf_ceiling: ../../rf_rules.bench.yml
boards:
  lin1: {host: simhost}
  lin2: {host: simhost}
