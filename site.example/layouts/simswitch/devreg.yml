---
# simswitch: the sim layout's board sim1, declared as a zephcore repeater instead of a
# zephyrtastic node. Applying this layout and then `sim` again switches the board's firmware
# family and back: the flasher finds it running the other family, writes the declared image,
# and the board's vocabulary tasks configure it. Needs `just sim-build` and
# `just sim-build-zephcore`, then `just sim-up sim1`.
plugin: rxrbench.core.devreg
layers: [sim]
registry: ../../../collections/ansible_collections/rxrbench/mesh/sim/registry.yaml
catalog_dir: ../../../collections/ansible_collections/rxrbench/mesh/sim/catalog
rf_ceiling: ../../rf_rules.bench.yml
boards:
  sim1: {host: simhost}
