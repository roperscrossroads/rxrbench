---
# sim: a bench that is processes. Two simulated boards (the real firmware on native_sim, see
# the mesh plugin's sim/) on this machine. It brings its own registry and catalog, so it needs nothing of the
# a site's; they live in that sim/, outside this directory, because Ansible reads every YAML file
# in a layout as inventory. Start it with `just sim-up`; the tool then treats it like any
# other layout.
plugin: rxrbench.core.devreg
layers: [sim]
registry: ../../../collections/ansible_collections/rxrbench/mesh/sim/registry.yaml
catalog_dir: ../../../collections/ansible_collections/rxrbench/mesh/sim/catalog
rf_ceiling: ../../rf_rules.bench.yml
boards:
  sim1: {host: simhost}
  sim2: {host: simhost}
