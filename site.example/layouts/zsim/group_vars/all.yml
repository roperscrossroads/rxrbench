---
# Sockets, interpreter, store and the sim flasher: from layers/sim (devreg.yml `layers:`).

# Simulated boards may be written to freely. (A go-ahead is never inherited from a layer.)
bench_apply_allowed: true

# The image each board is declared to run: from the image store `just sim-zephyr-build` fills.
bench_image: "{{ bench_store }}/zephyr/{{ firmware.image }}"

# What `just device-test zsim` checks on each board, through its broker: the shell answers,
# it is a Zephyr, it has been up.
bench_tests:
  - {name: version, cmd: kernel version, expect: "^Zephyr version"}
  - {name: uptime, cmd: kernel uptime, expect: "^Uptime: [0-9]+ ms"}

# What `just scenario zsim` runs: steps across the boards, in order, each judged on the board
# it names; `within` gives a step that many seconds to come true. The boards here are islands
# (no radio between them), so the scenario only shows the shape: on a bench whose boards talk,
# a step on one is judged on another.
bench_scenarios:
  - name: both-answer
    steps:
      - {board: zb1, name: version, cmd: kernel version, expect: "^Zephyr version"}
      - {board: zb2, name: up, cmd: kernel uptime, expect: "^Uptime: [0-9]+ ms", within: 5}
      - {board: zb1, name: up, cmd: kernel uptime, expect: "^Uptime: [0-9]+ ms"}
      - {board: zb3, name: version, cmd: settings read string app/version, expect: "^[0-9]+[.][0-9]+$"}
      - {board: zb4, name: name, cmd: settings read string net/name, expect: "^zb4$", within: 5}

# The library tests this layout runs (site.example/tests/): each role bound to a board here.
# `just scenario zsim` runs them after the inline scenarios above, as scenarios of their own name.
bench_test_bindings:
  zephyr-shells-answer: {a: zb1, b: zb3}
