---
# The probe chip's config regions backed up (Family.chip_tasks, region_backup): through core's
# region flow on this plugin's route, so it registers what core's region_backup returns.
- name: Read the config regions through the probe
  fixture.widgets.probe_chip:
    board: "{{ bench_board }}"
    chip: "{{ probechip_flash }}"
    action: region_backup
    image: "{{ board_host_store | default('~/rxrbench/store') }}/{{ bench_image | basename }}"
    dest: "{{ bench_runs_dir }}/probe-region-backups"
    flash_regions: "{{ bench_flash_regions | default([]) }}"
  register: board_region_result

- name: What core's play reads
  ansible.builtin.set_fact:
    backup: "{{ board_region_result }}"
