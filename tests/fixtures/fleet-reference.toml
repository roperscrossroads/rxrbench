# The fleet classes' build recipes as they once stood: the reference
# tests/unit/test_recipe.py compares catalog/zephyrtastic.yml against. Comments stripped.

[classes.1]
board = "xiao_ble/nrf52840"
hw_model = 88
variant = "ble (XIAO nRF52840 + Wio-SX1262)"
build = "west build -d build-xiao-f7 --sysbuild -b xiao_ble/nrf52840 main/samples/meshtastic -- -DSHIELD=wio_sx1262_xiao -DEXTRA_CONF_FILE=\"overlay-ota-shell.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-health.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sig-required.conf;overlay-ble-peer.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf\" -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\\\"$HOME/.config/zephyrtastic/fleet-ec-p256.pem\\\""

[classes.2]
board = "heltec_wifi_lora32_v4_r8/esp32s3/procpu"
hw_model = 132
variant = "ble + smp-central + depot (courier)"
build = "west build -d build-heltec-v4r8-f7 --sysbuild -b heltec_wifi_lora32_v4_r8/esp32s3/procpu main/samples/meshtastic -- -DEXTRA_CONF_FILE=\"overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-ota-shell.conf;overlay-smp-central.conf;overlay-depot.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf\" -DEXTRA_DTC_OVERLAY_FILE=\"depot.overlay\" -DSB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\\\"$HOME/.config/zephyrtastic/fleet-ec-p256.pem\\\""

[classes.4]
board = "heltec_wifi_lora32_v4/esp32s3/procpu"
hw_model = 110
variant = "ble + cluster (healthy V4 member)"
build = "west build -d build-heltec-v4-f7 --sysbuild -b heltec_wifi_lora32_v4/esp32s3/procpu main/samples/meshtastic -- -DEXTRA_CONF_FILE=\"overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-v4-member.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf\" -DEXTRA_DTC_OVERLAY_FILE=\"coredump-big.overlay\" -DSB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\\\"$HOME/.config/zephyrtastic/fleet-ec-p256.pem\\\""

[classes.5]
board = "heltec_wifi_lora32_v4/esp32s3/procpu"
hw_model = 110
variant = "ble + scanner autostart, no cluster, no beacons (listener)"
build = "west build -d build-heltec-v4-listener --sysbuild -b heltec_wifi_lora32_v4/esp32s3/procpu main/samples/meshtastic -- -DEXTRA_CONF_FILE=\"overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-scanner.conf;overlay-v4-member.conf;overlay-v4-listener.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf\" -DEXTRA_DTC_OVERLAY_FILE=\"coredump-big.overlay\" -DSB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\\\"$HOME/.config/zephyrtastic/fleet-ec-p256.pem\\\""

