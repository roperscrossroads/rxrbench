hw_model = 88
variant = "ble (XIAO, cluster c2: verifies but does not REQUIRE signatures)"
build = "west build -d build-xiao-c2 --sysbuild -b xiao_ble/nrf52840 main/samples/meshtastic -- -DSHIELD=wio_sx1262_xiao -DEXTRA_CONF_FILE=\"overlay-ota-shell.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-health.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-ble-peer.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf\" -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\\\"$HOME/.config/zephyrtastic/fleet-ec-p256.pem\\\" -DCONFIG_MESHTASTIC_FLEET_CLASS=7 -DCONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS=\\\"--custom-tlv\\ 0x00A0\\ 0x07\\\""

