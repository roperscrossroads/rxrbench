[classes.11]
board = "xiao_ble/nrf52840"
hw_model = 88
variant = "XIAO relay EAR: forwards heard broadcast text over the peer link, transmit compiled out; `meshtastic ear peer <id>`"
build = "west build -d build-xiao-ear11 --sysbuild -b xiao_ble/nrf52840 main/samples/meshtastic -- -DSHIELD=wio_sx1262_xiao -DEXTRA_CONF_FILE=\"overlay-ota-shell.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-health.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-ble-peer.conf;overlay-led-status.conf;overlay-relay-ear.conf\" -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\\\"$HOME/.config/zephyrtastic/fleet-ec-p256.pem\\\" -DCONFIG_MESHTASTIC_FLEET_CLASS=11 -DCONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS=\\\"--custom-tlv\\ 0x00A0\\ 0x0b\\\""

[classes.12]
board = "xiao_ble/nrf52840"
hw_model = 88
variant = "XIAO keyless radio HEAD: forwards every heard frame undecoded to its brain over the peer link, retunes on request; no keys, no NodeDB, no identity on the air; `meshtastic attach brain <id>`"
