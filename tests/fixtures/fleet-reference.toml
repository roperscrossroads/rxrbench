variant = "Heltec V3 keyless radio HEAD: class 12's role on the V3 -- forwards every heard frame undecoded to its brain, transmits what its brain hands it; no keys, no NodeDB; dram0 ~76 %"
build = "west build -d build-heltec-v3-head13 --sysbuild -b heltec_wifi_lora32_v3/esp32s3/procpu main/samples/meshtastic -- -DEXTRA_CONF_FILE=\"overlay-v4-unified.conf;overlay-nonet.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-ble-peer.conf;overlay-rf.conf;overlay-led-status.conf;overlay-attachment-head.conf\" -DCONFIG_MESHTASTIC_FLEET_CLASS=13 -DCONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS=\\\"--custom-tlv\\ 0x00A0\\ 0x0d\\\" -DSB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\\\"$HOME/.config/zephyrtastic/fleet-ec-p256.pem\\\""
