[defaults]
# A layout is selected with -i <layout dir> (`just` finds it with tools/where.py: <site>/layouts/,
# else site.example/layouts/); there is no default inventory.
# A site's own plugin collections live in site/collections (CONTRIBUTING.md#public-and-private).
collections_path = ./collections:./.collections:./site/collections
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
# A YAML mapping with a key twice (a `<<:` merge overridden included) is an error, not a warning.
duplicate_dict_key = error
# group_vars/host_vars *.sops.yaml are decrypted at run time (the age key in
# ~/.config/sops/age/keys.txt); the plaintext never reaches disk.
vars_plugins_enabled = host_group_vars,community.sops.sops
stdout_callback = default
# How long each task and module phase took, written for a play given bench_run (the just
# recipes give one): runs/<run>/timing-<play>.json (docs/ARCHITECTURE.md#checking-depth).
callbacks_enabled = rxrbench.core.timing
result_format = yaml
nocows = True

[inventory]
enable_plugins = rxrbench.core.devreg, ansible.builtin.yaml, ansible.builtin.auto

[ssh_connection]
pipelining = True
