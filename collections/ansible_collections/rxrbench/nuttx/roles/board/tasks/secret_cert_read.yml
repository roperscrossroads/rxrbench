---
# The declared cert (the file `nuttx.secrets.cert` names) against what the board holds.
- name: Compare the declared cert
  rxrbench.nuttx.nuttx_files:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    storage: "{{ nuttx.storage | default(omit) }}"
    files: "{{ {nuttx.secrets.cert: nuttx.files[nuttx.secrets.cert]} }}"
    secrets: ["{{ nuttx.secrets.cert }}"]
  check_mode: true
  register: board_cert
  failed_when: false
  no_log: true
  when: nuttx.secrets.cert is defined and nuttx.files[nuttx.secrets.cert] is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ nuttx.secrets.cert | default('cert') }}"
      declared: "{{ nuttx.secrets.cert is defined and nuttx.files[nuttx.secrets.cert] is defined }}"
      matches: "{{ not (board_cert.steps | default([]) | select('search', ': set$') | list | length > 0) }}"
      msg: "{{ board_cert.msg | default('') }}"
