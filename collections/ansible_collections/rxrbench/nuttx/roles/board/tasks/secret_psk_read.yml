---
# The declared psk (the file `nuttx.secrets.psk` names) against what the board holds.
- name: Compare the declared psk
  rxrbench.nuttx.nuttx_files:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    storage: "{{ nuttx.storage | default(omit) }}"
    files: "{{ {nuttx.secrets.psk: nuttx.files[nuttx.secrets.psk]} }}"
    secrets: ["{{ nuttx.secrets.psk }}"]
  check_mode: true
  register: board_psk
  failed_when: false
  no_log: true
  when: nuttx.secrets.psk is defined and nuttx.files[nuttx.secrets.psk] is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ nuttx.secrets.psk | default('psk') }}"
      declared: "{{ nuttx.secrets.psk is defined and nuttx.files[nuttx.secrets.psk] is defined }}"
      matches: "{{ not (board_psk.steps | default([]) | select('search', ': set$') | list | length > 0) }}"
      msg: "{{ board_psk.msg | default('') }}"
