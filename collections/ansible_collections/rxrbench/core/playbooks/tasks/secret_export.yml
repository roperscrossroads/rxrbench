---
# Escrow one secret a device made (`secret`). An escrowed value is never replaced by a
# different one in silence: a board that now holds another was most likely erased, and the
# escrow is what brings it back. -e rekey=true accepts the board's new one instead.
- name: Read the secret
  ansible.builtin.include_tasks: secret_read.yml

- name: Not read
  ansible.builtin.debug:
    msg: "{{ bench_board }}: {{ secret.kind }} not escrowed: {{ board_secret.msg | default('?', true) }}"
  when: (board_secret.value | default('', true) | length) == 0

- name: What the site holds
  ansible.builtin.include_tasks: secret_escrow.yml
  when: (board_secret.value | default('', true) | length) > 0

- name: A different secret is not escrowed over the old one
  ansible.builtin.assert:
    that: >-
      (board_escrowed | length) == 0 or board_escrowed.value == board_secret.value
      or rekey | default(false) | bool
    fail_msg: >-
      {{ bench_board }} holds another {{ bench_family }} {{ secret.kind }} than the escrow
      ({{ board_secret.id }}, escrow {{ board_escrowed.id | default('?') }}):
      it was probably erased. `just keys-restore` gives it the escrowed one back;
      -e rekey=true escrows the new one instead.
    quiet: true
  when: (board_secret.value | default('', true) | length) > 0

- name: The site's escrow directory
  ansible.builtin.file:
    path: "{{ secret_escrow_file | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  when: (board_secret.value | default('', true) | length) > 0

- name: Write the escrow (encrypted)
  community.sops.sops_encrypt:
    path: "{{ secret_escrow_file }}"
    config_path: "{{ site_root | default(bench_site_dir) }}/.sops.yaml"
    content_yaml: >-
      {{ board_escrow_doc | rxrbench.core.escrow_put(bench_board, bench_family, secret.kind,
                                                     board_secret, now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}
    mode: "0600"
  delegate_to: localhost
  no_log: true
  when:
    - (board_secret.value | default('', true) | length) > 0
    - (board_escrowed | length) == 0 or board_escrowed.value != board_secret.value
  register: secret_written

- name: Escrowed
  ansible.builtin.debug:
    msg: >-
      {{ bench_board }}: {{ bench_family }} {{ secret.kind }} {{ board_secret.id }}
      {{ 'escrowed' if secret_written is changed else 'already escrowed' }} in
      identity/{{ bench_board }}.sops.yaml
  when: (board_secret.value | default('', true) | length) > 0
