---
# One line about one secret of one board: what is expected, what the device says, a verdict.
# Nothing secret is shown: a value is compared here and named by its fingerprint.
- name: Read the secret
  ansible.builtin.include_tasks: secret_read.yml

- name: Nothing escrowed is known yet
  ansible.builtin.set_fact:
    board_escrowed: {}

- name: What the site holds
  ansible.builtin.include_tasks: secret_escrow.yml
  when: secret.origin == 'device'

- name: Say
  ansible.builtin.debug:
    msg: >-
      {{ bench_board }}: {{ secret.kind }} ({{ secret.origin }}):
      {{ secret | rxrbench.core.secret_verdict(board_secret, board_escrowed | default({})) }}
