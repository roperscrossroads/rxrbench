---
# What the site holds for one secret of one board (`secret`): `board_escrowed`, {} when there
# is none. The escrow file is the site's, encrypted (SOPS).
- name: Is there an escrow file
  ansible.builtin.stat:
    path: "{{ secret_escrow_file }}"
  register: secret_escrow_stat
  delegate_to: localhost
  check_mode: false

- name: The escrowed secret
  ansible.builtin.set_fact:
    board_escrow_doc: >-
      {{ (lookup('community.sops.sops', secret_escrow_file) | from_yaml)
         if secret_escrow_stat.stat.exists else {} }}
  no_log: true

- name: This kind of it
  ansible.builtin.set_fact:
    board_escrowed: "{{ board_escrow_doc | rxrbench.core.escrow_get(bench_family, secret.kind) }}"
  no_log: true
