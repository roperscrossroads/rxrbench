---
# One secret of one board (`secret`, an entry of bench_secret_kinds), read by its plugin's step
# into `board_secret`: {id, fingerprint, value} for one the device made, {id, declared, matches}
# for one the layout declares, and `msg` when it could not be read.
- name: Forget the last secret read
  ansible.builtin.set_fact:
    board_secret: {}

- name: Read it
  ansible.builtin.include_role:
    name: "{{ bench_plugin }}.board"
    tasks_from: "secret_{{ secret.tasks }}_read"
