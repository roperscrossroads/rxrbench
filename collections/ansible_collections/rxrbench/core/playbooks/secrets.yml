---
# What secrets each device holds, and whether each is the one it should be: a secret the
# device made (its identity key) against the site's escrow, a secret the layout declares (a
# channel key, a password) against the declaration. Reads, compares, changes nothing, and
# shows no secret: `just secrets <layout>`.
- name: Secrets
  hosts: boards
  gather_facts: false
  # boards at a time (-e parallel=N); a busy broker is waited for, not a failure
  serial: "{{ parallel | default(4) }}"
  vars:
    secret_escrow_file: "{{ bench_site_dir }}/identity/{{ bench_board }}.sops.yaml"
  tasks:
    - name: Nothing this tool knows of
      ansible.builtin.debug:
        msg: "{{ bench_board }}: no secrets this tool knows of"
      when: not (bench_plugin is defined and bench_secret_kinds | default([]) | length > 0)

    - name: Each secret
      ansible.builtin.include_tasks: tasks/secret_status.yml
      loop: "{{ bench_secret_kinds | default([]) if bench_plugin is defined else [] }}"
      loop_control:
        loop_var: secret
        label: "{{ secret.kind }}"
