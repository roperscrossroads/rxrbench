# MCUmgr (SMP) over the shell's UART on an emulated MCU (docs/SIMULATED.md: the SMP
# server beside the shell on the board's one UART, the image group on the board's flash, under
# MCUboot (sysbuild, RAM-load mode). The native_sim variant is smp-shell.conf; the frame and
# buffer sizes are its (the MPS2 has megabytes of RAM; a 16 KB micro:bit cannot hold the
# image group at all).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_KERNEL_SHELL=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=32
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
# under MCUboot's RAM-load mode: which slot runs is what MCUboot wrote in the retained region
# (mps2-ramload.overlay), read through the retention subsystem; the image manager needs it
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=2048
CONFIG_SHELL_PROMPT_UART="zq:~$ "
# no log on the console (the frames and the shell are what the bench reads), no statistics
CONFIG_LOG=n
CONFIG_STATS=n
CONFIG_STATS_NAMES=n
CONFIG_MCUMGR_GRP_STAT=n
CONFIG_THREAD_MONITOR=n
CONFIG_MCUMGR_GRP_OS_TASKSTAT=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
