# MCUboot on the MPS2 AN385 under QEMU, beside mcuboot-small.conf: the slots in the flash
# simulator (mps2-ramload.overlay), and what RAM load needs: MCUboot tells the application
# which slot it loaded through the retained region (Zephyr's retention subsystem), since an
# image copied to RAM cannot tell by its address; without it the application's image manager
# does not build.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION=y
CONFIG_BOOT_SHARE_DATA=y
CONFIG_BOOT_SHARE_DATA_BOOTINFO=y
CONFIG_BOOT_SHARE_BACKEND_RETENTION=y
