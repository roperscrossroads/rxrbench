# MCUmgr (SMP) alone on a small QEMU MCU's one UART (docs/SIMULATED.md: no shell, no
# console; the image group on the board's flash, under MCUboot (sysbuild). A device that is
# managed over SMP and nothing else, in 16 KB of RAM.
CONFIG_SHELL=n
CONFIG_CONSOLE=y          # the console subsystem is where the SMP UART driver lives
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_STATS=n
CONFIG_STATS_NAMES=n
CONFIG_THREAD_MONITOR=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_UART_MCUMGR_RX_BUF_SIZE=256
CONFIG_UART_MCUMGR_RX_BUF_COUNT=2
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=n
CONFIG_MCUMGR_GRP_STAT=n
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
CONFIG_MAIN_STACK_SIZE=768
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=768
