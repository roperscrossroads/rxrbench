# A Zephyr application on native_sim as a simulated bench board: its console (the shell) on a
# pty of its own, named on the process's stdout ("connected to pseudotty: /dev/pts/N"), which
# is what sim/simboard.py reads and the broker opens. Added to any application's own
# configuration by tools/zephyr_sim.py (EXTRA_CONF_FILE).
CONFIG_UART_NATIVE_PTY=y
CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
