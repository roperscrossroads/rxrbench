# MCUmgr (SMP) over the shell's UART on native_sim: the SMP server beside the shell on the
# board's pty, the image group on the flash simulator's slots, no bootloader (native_sim
# runs no MCUboot: an uploaded image lands in the spare slot and stays there, which is what
# the PC bench's MCUmgr tests are about; a real swap is the QEMU board's).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
# the SMP frames are caught in the shell's interrupt-driven UART path, not the polling one;
# the shell's log backend would interleave log lines with the frames
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
CONFIG_SHELL_LOG_BACKEND=n
# frames big enough for an upload, and the parameters request a client sizes its frames by
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=2048
# one receive buffer per line of a frame, until the SMP thread takes them: an upload frame is ten
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=32
