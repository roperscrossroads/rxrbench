---
DOCUMENTATION:
  name: secret_verdict
  short_description: Whether a board's secret is the one it should be, in words that show none
  description:
    - "C(secret | rxrbench.core.secret_verdict(read, escrowed)) judges one secret of one board.
      C(secret) is an entry of C(bench_secret_kinds), C(read) what its plugin's read step found,
      C(escrowed) the site's record of a secret the device made."
    - "A secret the device made is compared with the escrow: it matches, it differs, it is not
      escrowed yet (C(just keys-export)), the layout chose not to escrow it, or it cannot be read."
    - "A declared secret is compared with the declaration: as declared, it differs
      (C(just plan)), it is not declared, or it cannot be read."
    - "The verdict names a secret by its id or fingerprint only, never by its value. A secret
      that differs from the escrow under the same id (a node whose id does not follow its key)
      is named by both keys' fingerprints."
  author:
    - Adam Roper (@roperscrossroads)
