---
# What each entry point of this role reads (a play enters it by tasks_from). Ansible checks
# the types when the role is entered; antsibull-docs documents them. tests/unit/
# test_role_specs.py holds this file to what the tasks read (tools/role_vars.py).
argument_specs:
  enroll:
    short_description: "Enroll a board on the route that delivers its image"
    description:
      - >-
        A board whose flash route carries its image itself, and whose layout declares the credential
        the board shows that route: the route is made to hold the board with it. A plan says what
        would be done and tells the route nothing.
    options:
      bench_apply_allowed: &bench_apply_allowed
        type: bool
        description: >-
          C(true) lets C(just apply) (and every other writing play) write to this layout's boards; without it
          a layout can only be planned. Every writing play passes one gate (C(playbooks/tasks/gate.yml)) and
          hands the go-ahead to each writing module (C(apply_allowed)), which refuses without it.
      bench_board: &bench_board
        type: str
        description: >-
          The board's name in the layout.
      bench_delivery: &bench_delivery
        type: dict
        description: >-
          Set by the layout when the board's flash route carries the image itself (a plugin's delivering
          route) and the image is written by a core flasher that hands it over (C(smp)): the route's
          C(bearer), the C(tool) that speaks for it on a bench host, the C(formats) it carries, the board's
          C(address) on it and the name of the layout variable holding its C(settings). The image is then
          not uploaded from the bench host; the board is read over the route it would otherwise be written by.
      bench_delivery_tool: &bench_delivery_tool
        type: str
        description: >-
          Where the delivering route's tool is on the bench host, when it is not in the place the plugins'
          host tools are installed.
      bench_devreg_tool: &bench_devreg_tool
        type: str
        description: >-
          The devreg script on the host that reaches a Linux device, when it is not the deployed
          C(~/.devreg/devreg.py) (a layout whose modules run on the controller names the repository's own).
      bench_registry: &bench_registry
        type: str
        description: >-
          The site's device registry file.
  forget_bootloader:
    short_description: "Forget the bootloader read C(just boot) recorded for a board"
    description:
      - >-
        A write that can replace a board's bootloader (a whole chip or image, a first flash) makes the
        bootloader read C(just boot) recorded stale: forgotten, so the next plan reads it again or
        says it does not know, instead of comparing a chip it no longer describes.
    options:
      bench_board: *bench_board
      bench_facts_dir: &bench_facts_dir
        type: str
        description: >-
          Where the site keeps the boards' facts (what the survey and C(just boot) record).
      bench_repo: &bench_repo
        type: str
        description: >-
          The tool's repository (its C(venv/), C(tools/), C(runs/), C(backups/), C(.build/)): a layout names a
          path under it with this, never with C(playbook_dir).
  main:
    short_description: "Bring one board to its declared image and config"
    description:
      - >-
        One board, from what it is to what its layout declares. Every step reads the board, changes
        only what differs and reads it again, so a second run changes nothing.  Order: the image, then
        the config the family's vocabulary writes. A layout that names no image for a board
        (bench_image) does not flash it; a family may say a board of it takes no config, and then it
        gets the image only.
    options:
      bench_app_manager_overwrite: &bench_app_manager_overwrite
        type: bool
        description: >-
          Per board: C(true) lets an ESP32 whose partition table shows an app manager (a firmware in its own
          partition that installs other images in slots beside it) be written at 0x0 or into those slots,
          which orphans every installed app: C(bench_overwrite: [all]) for this board. Without it (or
          C(bench_overwrite) naming each region the write takes) every ESP32 writer refuses such a chip: a
          plan by the write rule over the survey's record of the chip, the apply over the table and images it
          reads before writing.
      bench_overwrite: &bench_overwrite
        type: list
        description: >-
          Per board: the regions of the chip a write may take although they hold firmware the board does not
          run, by their partition labels (C([ota_1, game])), or C([all])
          (docs/ARCHITECTURE.md#partitions-and-the-write-rule). Without it, an ESP32 write that would cover
          such a region, or a new partition table that would drop one, is refused and names each region. On a
          chip with an app manager every data region (C(nvs), a filesystem) is shared by its apps, so a region
          erase or restore there names it too (C([nvs, spiffs])). C(bench_app_manager_overwrite: true) is
          C([all]).
      bench_foreign: &bench_foreign
        type: str
        description: >-
          Per layout or board: what a plan does with what the survey found on a chip that the layout does not
          own (other firmware in an app slot, data every app of a chip with an app manager shares;
          docs/ARCHITECTURE.md#partitions-and-the-write-rule): C(info) (the default) prints it, C(warn) prints
          it as a warning, C(refuse) stops the board. Read from the survey's facts, with their date; a write
          checks the chip itself whatever this says. Regions C(bench_overwrite) names are left out too, and
          what the board's family says its declaration owns there (a Launcher layout: Launcher, the apps it
          declares, and the shared data when it declares every app on the chip).
      bench_apply_allowed: *bench_apply_allowed
      bench_delivery: *bench_delivery
      bench_delivery_tool: *bench_delivery_tool
      bench_delivery_timeout:
        type: float
        description: >-
          Seconds a board has to take a delivery and run the image (default 1800): it asks its route on its
          own schedule, so this is that interval plus the download, the reset and the swap.
      bench_devreg_tool: *bench_devreg_tool
      bench_ble_rebond: &bench_ble_rebond
        type: str
        description: >-
          C(smp) over BLE, what to do with a bond the host holds when the first exchange fails: C(auto)
          (default) removes it only when the board, asked on its console, no longer holds it; C(force) removes
          it without asking; C(never) leaves it.
      bench_board: *bench_board
      bench_family:
        type: str
        description: >-
          The firmware family the board declares (C(firmware.family)): a record that C(just boot)
          replaced its loader for this family (its facts' C(boot_switch)) makes this write a first
          flash. (Documented with the other layout variables: C(just docs-layout).)
      bench_board_tag: &bench_board_tag
        type: str
        description: >-
          The registry's board type for the board: an image must be built for it.
      bench_board_type: &bench_board_type
        type: dict
        description: >-
          The board type's entry in the board catalog (C(catalog/boards.yml): core's, each plugin's
          and a site's, later over earlier), as a dict: its chip, PSRAM, UF2 and Launcher entry
          ways, a bridge's modem-line rest.
      bench_boot_radio_ok: &bench_boot_radio_ok
        type: bool
        description: >-
          Per board: C(true) lets a fresh write (a first flash, a family switch) of an image whose catalog
          C(boot_radio) breaks the RF rules go ahead: the board's antenna is on a dummy load, or it is
          shielded. Without it the flasher refuses, naming what the image would transmit on.
      bench_boot_radio_problems: &bench_boot_radio_problems
        type: list
        description: >-
          Where the image's catalog C(boot_radio) breaks this board's RF rules, in words; empty when
          it does not or the catalog records none. A fresh write is refused while it is not empty,
          unless C(bench_boot_radio_ok).
      bench_chip_mac: &bench_chip_mac
        type: str
        description: >-
          An ESP32's MAC as the registry holds it (C(policy.chip_mac), else a C(usb_serial) that is a MAC,
          else the MAC a C(serial_by_id) carries): what C(esp-image), the esptool routes and C(erase-chip)
          check in their loader session before they write.
      bench_console_elsewhere: &bench_console_elsewhere
        type: bool
        description: >-
          Per board: C(true) lets a picoboot image whose shell is not on the board's USB port (the manifest's
          C(console), from its build) be written to a board the bench reaches by its console: its console is
          wired elsewhere (a UART on the bench host).
      bench_facts_dir: *bench_facts_dir
      bench_families: &bench_families
        type: dict
        description: >-
          Every loaded family as data (C(module_utils/familyspec.py)): what a module on a bench host takes as
          C(families).
      bench_flash_regions: &bench_flash_regions
        type: list
        description: >-
          From the catalog image's C(regions), else its family's C(flash_regions): the ranges of a chip with
          no partition table and no flash map in its images (C([{label, kind, start, size, role}])), checked
          when the layout loads. A flasher that can read the chip asks the write rule over them, and refuses a
          write over the C(boot) range unless C(bench_overwrite) names it
          (docs/ARCHITECTURE.md#partitions-and-the-write-rule).
      bench_first_flash: &bench_first_flash
        type: bool
        description: >-
          Per board: C(true) lets a board that does not answer as the image's family be written (an ESP32 is
          erased whole first).
      bench_uf2_enter_as: &bench_uf2_enter_as
        type: str
        description: >-
          Per board, or C(-e) for one run: the family whose way of asking for UF2 mode the board's app takes,
          when no family's read can say what it runs (a first flash). Needed only when the plan refuses
          because two families' shells run on the app's USB vendor and ask differently (two Zephyr firmwares
          on 2fe3). When the board says it runs another family, the flash refuses: what the board says wins
          (docs/ARCHITECTURE.md#entering-uf2-mode).
      bench_full_erase: &bench_full_erase
        type: bool
        description: >-
          For one run (C(just apply <layout> -e bench_full_erase=true)): an C(esp-image) board on its image's
          partition table gets a full install, the whole chip with every data partition as the image has it
          (its config and identity gone), instead of an update, which writes its app partitions only, as a
          vendor's web installer does without its full-erase box.
      bench_flash_unknown: &bench_flash_unknown
        type: bool
        description: >-
          C(false) refuses a board that answers as its family but reports neither a build nor a hash, instead
          of writing it forward. Default C(true): firmware older than the build id could not be rolled
          otherwise. Whatever it says, the read-back after a write must match the image, and an image with no
          build or hash is always refused.
      bench_check_depth: &bench_check_depth
        type: str
        description: >-
          C(full) (the default) or C(spot), for a layout, a board or one run (C(-e bench_check_depth=spot)):
          how much the checks before a write read (docs/ARCHITECTURE.md#checking-depth). C(spot) reads only
          what a read's design says is enough for its decision, and only where a read has a spot form; a first
          flash, a family switch and the other moments that read in full ignore it. In a plan, a flasher that
          offers it (esp-image, smp) takes what the board runs from its last full read instead of asking it,
          while the bench host's plug watcher has seen nothing on its port since; a write by hand or over the
          air that makes no USB event is not seen (docs/ARCHITECTURE.md#checking-depth): keep C(full) on a
          bench where hands or other tools write to boards. Each flasher's result says which depth it used and
          why (C(checked), C(identity_checked)).
      bench_flasher: &bench_flasher
        type: str
        description: >-
          C(esptool), C(esp-image), C(uf2), C(picoboot), C(smp), C(swd) or C(sim) (a plugin may name its own):
          how the image is written. The catalog's class or the registry's C(swd) route sets it, a layout may
          override.
      bench_image: &bench_image
        type: str
        description: >-
          The directory of a board's staged image (C(manifest.json) beside the image); no image, no flash.
      bench_kind: &bench_kind
        type: str
        description: >-
          The registry's C(kind) for the board (C(sim) for a simulated one).
      bench_mcu: &bench_mcu
        type: str
        description: >-
          The board type's chip (C(catalog/boards.yml): core's, each plugin's and a site's, later over
          earlier): what esptool is told.
      bench_picoboot_ask_timeout: &bench_picoboot_ask_timeout
        type: int
        description: >-
          Per board, C(picoboot) only, over the board type's C(uf2.ask_timeout): seconds a touch or shell
          command may take before that way counts as failed (default 15).
      bench_picoboot_enter: &bench_picoboot_enter
        type: list
        description: >-
          Per board, C(picoboot) only: the ways into the ROM bootloader, in order, over the board type's
          C(uf2.enter) (C(reset-interface), C(touch-1200), C(shell:<command>), C(manual)).
      bench_picoboot_enter_wait: &bench_picoboot_enter_wait
        type: int
        description: >-
          Per board, C(picoboot) only, over the board type's C(uf2.enter_wait): seconds to wait for the
          bootloader after each way in (default 10).
      bench_picoboot_manual_wait: &bench_picoboot_manual_wait
        type: int
        description: >-
          Per board, C(picoboot) only: the seconds C(manual) waits for BOOTSEL to be held while reset is
          pressed (default 0: not offered).
      bench_plugin: &bench_plugin
        type: str
        description: >-
          The plugin collection that brings the board's family (unset for a built-in one).
      bench_psram: &bench_psram
        type: raw
        description: >-
          The board type's PSRAM, which a first flash checks.
      bench_repo: *bench_repo
      bench_registry: *bench_registry
      bench_routes: &bench_routes
        type: dict
        description: >-
          One route per verb (C(shell), C(flash), C(config), C(diag)): bearer, host, address, what it can do.
      bench_sim_run: &bench_sim_run
        type: str
        description: >-
          The simulated bench's run directory (sockets, logs).
      bench_socket: &bench_socket
        type: str
        description: >-
          A board's broker socket path; the sim layer sets it, a real bench host's brokers are found by name.
      bench_tools: &bench_tools
        type: dict
        description: >-
          Where the bench host keeps a flasher's tools, when not where the default install puts them: a dict
          with any of C(esptool), C(imginfo), C(uf2_tool), C(devreg). UF2 boards are flashed through
          C(~/rxrbench/bin/uf2_flash.py).
      bench_usb_serial: &bench_usb_serial
        type: str
        description: >-
          The registry's C(match.usb_serial): the chip a flasher that selects by it is handed (C(picoboot)).
      bench_via: &bench_via
        type: str
        description: >-
          How a command reaches the device, from the route chosen for its shell: C(console) (through its
          serial broker), C(ssh), or none. C(just diag) and C(just device-test) use it; a device with no
          console is in the C(no_console) group and gets no broker.
      bench_vocabulary: &bench_vocabulary
        type: str
        description: >-
          The family's configuration language, which names its plugin's task file.
      board_host_store: &board_host_store
        type: str
        description: >-
          Where a bench host keeps the images staged for its boards.
      board_identity_file: &board_identity_file
        type: str
        description: >-
          Where the site escrows the secrets a board made (playbooks/keys-export.yml).
      board_smp_python: &board_smp_python
        type: str
        description: >-
          The Python on the bench host that has smpclient (MCUmgr), for C(smp_flash) only: the login
          user's C(~/.venv-mcumgr).
      firmware: &firmware
        type: dict
        description: >-
          The board's declared firmware: C(family) and C(image) (a catalog name), and what its
          plugin reads beside them.
  chip_findings:
    short_description: "Say what the survey found on the chip that the layout does not own"
    description:
      - >-
        From the board's survey facts, never the chip: other firmware in an app slot, or data every
        app on a chip with an app manager shares, less what C(bench_overwrite) names and what the
        board's family says its declaration owns there. Printed, or the board refused
        (C(bench_foreign)). The apply runs it on every board, whichever route updates it.
    options:
      bench_board: *bench_board
      bench_facts_dir: *bench_facts_dir
      bench_overwrite: *bench_overwrite
      bench_foreign: *bench_foreign
