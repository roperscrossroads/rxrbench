---
# The device's escrowed host key (`board_escrowed`: id, value), given back over ssh. A device
# that already holds it is left alone.
- name: Give the device its escrowed host key
  rxrbench.linux.linux_host_key:
    apply_allowed: "{{ bench_apply_allowed | default(false) | bool }}"
    route: "{{ bench_routes.shell }}"
    path: "{{ bench_host_key_paths }}"
    action: ensure
    value: "{{ board_escrowed.value }}"
    fingerprint: "{{ board_escrowed.id }}"
