---
# A Linux device with no update mechanism this tool drives: nothing is written. What it says
# it runs is read and compared with what the layout declares for it (`linux.os`, fields of
# /etc/os-release); a device that differs is named, because the way to change it is to
# re-image it (`just card`).
- name: Read the device
  ansible.builtin.include_tasks: facts_linux.yml

- name: It runs what the layout declares
  ansible.builtin.assert:
    that: board_os.differs | length == 0
    fail_msg: >-
      {{ bench_board }} is not what the layout declares
      ({{ board_os.differs | dict2items | map(attribute='key') | join(', ') }}:
      it says {{ board_os.differs | dict2items | map(attribute='value') | map('first') | join(', ') }},
      declared {{ board_os.differs | dict2items | map(attribute='value') | map('last') | join(', ') }}).
      Nothing here can change it: re-image it
    quiet: true
