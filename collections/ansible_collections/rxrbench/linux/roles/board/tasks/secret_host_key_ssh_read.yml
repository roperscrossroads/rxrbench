---
# The device's ssh host key, read over ssh, as `board_secret`. An absent device is reported
# by the play, not the end of the run.
- name: Read the device's host key
  rxrbench.linux.linux_host_key:
    route: "{{ bench_routes.shell }}"
    path: "{{ bench_host_key_paths }}"
  register: board_key
  no_log: true
  failed_when: false
  check_mode: false

- name: The key, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ board_key.fingerprint | default(none) }}"
      value: "{{ board_key.value | default(none) }}"
      fingerprint: "{{ board_key.fingerprint | default(none) }}"
      msg: "{{ board_key.msg | default('') }}"
  no_log: true
