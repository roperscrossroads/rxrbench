---
# The simulated A/B bench's device registry: a site registry's shape, no hardware in it. The
# device is a QEMU machine (sim/simvm.py) reached over ssh on a loopback port, with the key
# vm/make-keys.sh made and the host key pinned at its first boot.
version: 1
hosts:
  simhost: {hostname: this machine, local: true}
protected: []
devices:
  ab1:
    kind: sim
    firmware: linux
    policy: {board_tag: sim-qemuarm, compatible: rxrbench-sim-qemuarm}
    match: {}
    reach:
      ssh:
        host: simhost
        ip: 127.0.0.1
        port: 22211
        user: root
        state: live
        can: [shell, flash, diag]
        identity: ~/.cache/rxrbench/simvm/id_ed25519
        known_hosts: ~/.cache/rxrbench/simvm/known_hosts
