---
# The WebUI password a layout declares, against what Launcher holds: the state module compares
# them and says only whether they match.
- name: Compare the declared WebUI password
  rxrbench.launcher.launcher_state:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    entry: "{{ (bench_board_type | default({})).launcher_enter | default(omit) }}"
    wui_password: "{{ launcher_secrets[bench_board].wui_password }}"
  register: board_wui
  failed_when: false
  no_log: true
  when: launcher_secrets[bench_board].wui_password is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: wui
      declared: "{{ launcher_secrets[bench_board].wui_password is defined }}"
      matches: "{{ board_wui.launcher.wui_password_matches | default(false) }}"
      msg: "{{ board_wui.msg | default('') }}"
