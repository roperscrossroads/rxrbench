---
# The saved networks' passwords a layout declares, against what Launcher holds, each compared
# on the device's side of the console and only the verdict said.
- name: Compare the declared network passwords
  rxrbench.launcher.launcher_state:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    entry: "{{ (bench_board_type | default({})).launcher_enter | default(omit) }}"
    wifi_psks: "{{ launcher_secrets[bench_board].wifi_psk }}"
  register: board_psk
  failed_when: false
  no_log: true
  when: launcher_secrets[bench_board].wifi_psk is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: wifi
      declared: "{{ launcher_secrets[bench_board].wifi_psk is defined }}"
      matches: >-
        {{ (board_psk.launcher.wifi_psk_matches | default({})).values() | list | select('equalto', false)
           | list | length == 0 and board_psk.launcher.running | default(false) }}
      msg: >-
        {{ board_psk.msg | default('') }}{{ (board_psk.launcher.wifi_psk_matches | default({}))
           | dict2items | rejectattr('value') | map(attribute='key') | map('regex_replace', '^', 'differs: ')
           | join(', ') }}
