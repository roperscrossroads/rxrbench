---
# The declared cert (the setting `zephyr.secrets.cert` names) against what the board holds.
- name: Compare the declared cert
  rxrbench.zephyr.zephyr_settings:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    digest_command: "{{ (zephyr | default({})).digest_command | default(omit) }}"
    settings: "{{ {zephyr.secrets.cert: zephyr.settings[zephyr.secrets.cert]} }}"
    secrets: ["{{ zephyr.secrets.cert }}"]
  check_mode: true
  register: board_cert
  failed_when: false
  no_log: true
  when: zephyr.secrets.cert is defined and zephyr.settings[zephyr.secrets.cert] is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ zephyr.secrets.cert | default('cert') }}"
      declared: "{{ zephyr.secrets.cert is defined and zephyr.settings[zephyr.secrets.cert] is defined }}"
      matches: "{{ not (board_cert.steps | default([]) | length > 0) }}"
      msg: "{{ board_cert.msg | default('') }}"
