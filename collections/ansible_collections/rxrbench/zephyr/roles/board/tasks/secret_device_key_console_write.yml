---
# The escrowed key given back to the device (after an erase, or on a new chip): written as
# the setting the device reads at boot, so it does not make another.
- name: The device holds its escrowed key
  rxrbench.zephyr.zephyr_settings:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    settings: "{{ {zephyr.device_key: board_escrowed.value} }}"
    secrets: ["{{ zephyr.device_key }}"]
    apply_allowed: "{{ bench_apply_allowed | default(false) | bool }}"
  no_log: true
  when: board_escrowed.value | default('', true) | length > 0
