---
# The key the device made (the setting `zephyr.device_key` names), as a secret.
- name: Read the device's key
  rxrbench.zephyr.zephyr_settings:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    read: ["{{ zephyr.device_key }}"]
  register: board_key
  no_log: true
  check_mode: false
  failed_when: false

- name: The key, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ (board_key.found | default({}))[zephyr.device_key] | default('', true) | truncate(8, true, '') }}"
      value: "{{ (board_key.found | default({}))[zephyr.device_key] | default(none) }}"
      fingerprint: >-
        {{ (board_key.found | default({}))[zephyr.device_key] | default('', true)
           | hash('sha256') | truncate(16, true, '') }}
      msg: "{{ board_key.msg | default('') }}"
  no_log: true
