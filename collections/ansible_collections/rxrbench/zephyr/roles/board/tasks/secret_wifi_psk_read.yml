---
# The declared wifi_psk, a network key the device joins with (the setting `zephyr.secrets.wifi_psk`
# names), against what the board holds.
- name: Compare the declared wifi_psk
  rxrbench.zephyr.zephyr_settings:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    digest_command: "{{ (zephyr | default({})).digest_command | default(omit) }}"
    settings: "{{ {zephyr.secrets.wifi_psk: zephyr.settings[zephyr.secrets.wifi_psk]} }}"
    secrets: ["{{ zephyr.secrets.wifi_psk }}"]
  check_mode: true
  register: board_wifi_psk
  failed_when: false
  no_log: true
  when: zephyr.secrets.wifi_psk is defined and zephyr.settings[zephyr.secrets.wifi_psk] is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ zephyr.secrets.wifi_psk | default('wifi_psk') }}"
      declared: "{{ zephyr.secrets.wifi_psk is defined and zephyr.settings[zephyr.secrets.wifi_psk] is defined }}"
      matches: "{{ not (board_wifi_psk.steps | default([]) | length > 0) }}"
      msg: "{{ board_wifi_psk.msg | default('') }}"
