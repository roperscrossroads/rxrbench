---
# The declared token, what the device shows a server it asks (the setting `zephyr.secrets.token`
# names), against what the board holds.
- name: Compare the declared token
  rxrbench.zephyr.zephyr_settings:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    digest_command: "{{ (zephyr | default({})).digest_command | default(omit) }}"
    settings: "{{ {zephyr.secrets.token: zephyr.settings[zephyr.secrets.token]} }}"
    secrets: ["{{ zephyr.secrets.token }}"]
  check_mode: true
  register: board_token
  failed_when: false
  no_log: true
  when: zephyr.secrets.token is defined and zephyr.settings[zephyr.secrets.token] is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ zephyr.secrets.token | default('token') }}"
      declared: "{{ zephyr.secrets.token is defined and zephyr.settings[zephyr.secrets.token] is defined }}"
      matches: "{{ not (board_token.steps | default([]) | length > 0) }}"
      msg: "{{ board_token.msg | default('') }}"
