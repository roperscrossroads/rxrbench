---
# The declared psk (the setting `zephyr.secrets.psk` names) against what the board holds.
- name: Compare the declared psk
  rxrbench.zephyr.zephyr_settings:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    digest_command: "{{ (zephyr | default({})).digest_command | default(omit) }}"
    settings: "{{ {zephyr.secrets.psk: zephyr.settings[zephyr.secrets.psk]} }}"
    secrets: ["{{ zephyr.secrets.psk }}"]
  check_mode: true
  register: board_psk
  failed_when: false
  no_log: true
  when: zephyr.secrets.psk is defined and zephyr.settings[zephyr.secrets.psk] is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ zephyr.secrets.psk | default('psk') }}"
      declared: "{{ zephyr.secrets.psk is defined and zephyr.settings[zephyr.secrets.psk] is defined }}"
      matches: "{{ not (board_psk.steps | default([]) | length > 0) }}"
      msg: "{{ board_psk.msg | default('') }}"
