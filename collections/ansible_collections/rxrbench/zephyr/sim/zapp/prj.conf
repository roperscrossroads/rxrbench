# The shell (the bench's console), and the settings subsystem on the flash simulator (the
# board's flash file), with its shell: `settings read|write|list|delete`. A value as long as a
# certificate fits one command line.
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_CMD_BUFF_SIZE=2048
CONFIG_SHELL_PRINTF_BUFF_SIZE=256
CONFIG_SHELL_PROMPT_UART="zapp:~$ "
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_SHELL=y
# a key made at first boot wants randomness: the fake entropy driver, seeded per run
CONFIG_ENTROPY_GENERATOR=y
