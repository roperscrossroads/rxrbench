# Updates from a hawkBit server the device polls (`--hawkbit`, with --mcuboot, on a board with a
# network): Zephyr's client on zapp's own thread, the server, the token and the device's name read
# from settings (zhb/...), the running image confirmed by zapp after its healthy window.
CONFIG_ZAPP_HAWKBIT=y
CONFIG_HAWKBIT=y
CONFIG_HAWKBIT_AUTOHANDLER=n
CONFIG_HAWKBIT_SHELL=n
CONFIG_HAWKBIT_CONFIRM_IMG_ON_INIT=n
CONFIG_HAWKBIT_SET_SETTINGS_RUNTIME=y
CONFIG_HAWKBIT_SERVER=""
CONFIG_HAWKBIT_PORT=8080
CONFIG_HAWKBIT_DDI_TARGET_SECURITY=y
CONFIG_HAWKBIT_DDI_SECURITY_TOKEN=""
CONFIG_HAWKBIT_CUSTOM_DEVICE_ID=y
CONFIG_HAWKBIT_REBOOT_COLD=y
# what the client needs
CONFIG_HTTP_CLIENT=y
CONFIG_JSON_LIBRARY=y
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_REQUIRES_FULL_LIBC=y
# a fault resets the device, so MCUboot can swap an unconfirmed image back
CONFIG_RESET_ON_FATAL_ERROR=y
