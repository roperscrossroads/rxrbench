# zapp under MCUboot (tools/zapp_build.py --mcuboot): image and OS management over MCUmgr, on the
# shell's serial port (SMP frames inside the shell) and, in a build with WiFi, over UDP. The
# image is signed for MCUboot by the sysbuild.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
# The shell's USB serial port with flow control once zapp is up (MCUmgr's responses over the
# shell are otherwise cut at 64 bytes): Kconfig ZAPP_CONSOLE_FLOW_CONTROL says why at run time.
CONFIG_ZAPP_CONSOLE_FLOW_CONTROL=y
# Frames big enough for an upload, as the simulated SMP server has them (core/sim/zephyr/
# smp-shell.conf): the parameters request a client sizes its frames by, one receive buffer per
# line of a frame (an upload frame is ten), and shell ring buffers that hold a whole frame. With
# Zephyr's defaults (two buffers, a 256-byte ring) every upload chunk is dropped unanswered.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=32
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=2048
