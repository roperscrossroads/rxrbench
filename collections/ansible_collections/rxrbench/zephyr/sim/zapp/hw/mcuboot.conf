# zapp under MCUboot (tools/zapp_build.py --mcuboot): image and OS management over MCUmgr, on the
# shell's serial port (SMP frames inside the shell) and, in a build with WiFi, over UDP. The
# image is signed for MCUboot by the sysbuild.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
