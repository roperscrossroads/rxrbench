# zapp on a real board (every board in boards.yml): its settings on the flash's storage
# partition, not the simulator; keys from the chip's random source; the board's own id as its
# USB serial; `kernel reboot`; and the features every board has.
CONFIG_FLASH_SIMULATOR=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_ZAPP_DIGEST=y
CONFIG_ZAPP_STATE=y
CONFIG_ZAPP_SELFTEST=y
CONFIG_ZAPP_BOOTSEL=y
CONFIG_SHELL_PROMPT_UART="zapp:~$ "
