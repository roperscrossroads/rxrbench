# zapp on the emulated MCU with a network (QEMU's MPS2 AN385 under MCUboot, tools/zephyr_qemu.py):
# the board's Ethernet on QEMU's user network, which the simulated board is started with as
# 192.0.2.0/24: the guest is always .15 and this machine is its gateway, .2, so no DHCP is
# waited for. With hawkbit.conf, a simulated device that fetches its own updates from a server
# on this machine.
CONFIG_REBOOT=y
CONFIG_ZAPP_DIGEST=y
CONFIG_ZAPP_STATE=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=1
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
# a simulated device has no minute to spare: an image on its test boot confirms itself after
# ten seconds, and the server is asked every five
CONFIG_ZAPP_HAWKBIT_CONFIRM_SEC=10
CONFIG_ZAPP_HAWKBIT_MIN_POLL_SEC=5
