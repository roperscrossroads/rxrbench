# zapp at version 3.4: an image made to fail, for a build with the hawkBit client (--hawkbit).
# It faults a few seconds into its test boot, before it would confirm itself, so MCUboot
# returns to the image the device ran: an update that fails on the device.
CONFIG_ZAPP_VERSION="3.4"
CONFIG_SHELL_PROMPT_UART="zapp-3.4:~$ "
CONFIG_ZAPP_HAWKBIT_FAULT_SEC=8
