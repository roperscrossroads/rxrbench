# The sim board: zephyrtastic's own sample app on native_sim, with the shell on a pty.
# What a tool sees is what a board on the bench shows it: the same shell, the same
# `meshtastic state` and `meshtastic api`, the same settings store (the flash simulator's
# file, so a restart of the process is a reboot that keeps its config).
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_LORA=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_MESHTASTIC_SHELL=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_ADMIN=y
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_SETTINGS_NVS=y

# Quiet enough to read, loud enough to be a real console: log lines do arrive mid-command.
CONFIG_MESHTASTIC_LOG_LEVEL_INF=y
CONFIG_LORA_LOG_LEVEL_INF=y
