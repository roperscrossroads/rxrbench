  13:
    name: v3-worker
    summary: Heltec V3 keyless radio head
    board: heltec_wifi_lora32_v3/esp32s3/procpu
    board_tag: heltec-v3
    hw_model: 43
    build_dir: build-heltec-v3-head13
    notes: >-
      Heltec V3 keyless radio HEAD: class 12's role on the V3 --
      forwards every heard frame undecoded to its brain, transmits what its brain hands it; no keys, no
      NodeDB; dram0 ~76 %
    flasher: esptool
    class_in_recipe: true
    overlays:
      - overlay-v4-unified.conf
      - overlay-nonet.conf
      - overlay-pm-off.conf
      - overlay-nomqtt.conf
      - overlay-ble-peer.conf
      - overlay-rf.conf
      - overlay-bench.conf
      - overlay-led-status.conf
