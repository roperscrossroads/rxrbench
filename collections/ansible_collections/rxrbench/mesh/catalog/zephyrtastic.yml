---
# What each fleet class is built from. Data, not a shell string: recipe.py renders the argv.
#
#   name             the bundle name people use for the class (docs/CLASS-NAMING in the
#                    zephyrtastic tooling); layouts may name a class by it, the firmware
#                    prints it, and the recipe passes it as CONFIG_MESHTASTIC_FLEET_BUNDLE
#   board            the Zephyr board target
#   board_tag        must equal the registry's policy.board_tag for the board being flashed
#   hw_model         meshtastic HardwareModel the image reports
#   flasher          esptool (ESP32 boards) | uf2 (XIAO, OTAFIX bootloader)
#   shield           -DSHIELD, XIAO only
#   overlays         EXTRA_CONF_FILE, in order (later overlays win)
#   dtc_overlays     EXTRA_DTC_OVERLAY_FILE
#   sysbuild         SB_CONFIG_* settings
#   class_in_recipe  true when no overlay states the class: it and the signed TLV go in as defines
#   build_dir        the conventional build directory (relative to the workspace) for this class
#   notes            the longer description, with how the image is operated
#
# A board's `features` (layout host_vars) append overlays; see recipe.FEATURES.

classes:
  1:
    name: xiao-node
    summary: XIAO node; signs and verifies packets and synced config, requires signed config
    board: xiao_ble/nrf52840
    board_tag: xiao
    hw_model: 88
    build_dir: build-xiao-f7
    notes: "ble (XIAO nRF52840 + Wio-SX1262)"
    flasher: uf2
    shield: wio_sx1262_xiao
    overlays: &xiao_member
      - overlay-ota-shell.conf
      - overlay-ota-ble.conf
      - overlay-ota-ble-secure.conf
      - overlay-health.conf
      - overlay-rf.conf
      - overlay-bench.conf
      - overlay-node-id-from-key.conf
      - overlay-xeddsa.conf
      - overlay-cluster-sig-required.conf
      - overlay-ble-peer.conf
      - overlay-led-status.conf
      - overlay-cluster-sign.conf
      - overlay-xeddsa-sign.conf
      - overlay-quiet-first-boot.conf
    # Signing fits only with terse asserts (file and line, no message): ~38 KB of flash on the
    # 741 KB app slot. On Zephyr 4.5 that is the assert-level choice, not ASSERT_VERBOSE=n.
    defines:
      CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_TERSE: "y"

  2:
    name: r8-node-updater
    summary: V4-R8 courier; SMP central and firmware depot
    board: heltec_wifi_lora32_v4_r8/esp32s3/procpu
    board_tag: heltec-v4r8
    hw_model: 132
    build_dir: build-heltec-v4r8-f7
    notes: "ble + smp-central + depot (courier)"
    flasher: esptool
    overlays:
      - overlay-v4-unified.conf
      - overlay-nonet.conf
      - overlay-gnss.conf
      - overlay-pm-off.conf
      - overlay-nomqtt.conf
      - overlay-cluster.conf
      - overlay-ota-ble.conf
      - overlay-ota-ble-secure.conf
      - overlay-ota-shell.conf
      - overlay-smp-central.conf
      - overlay-depot.conf
      - overlay-health.conf
      - overlay-coredump-flash.conf
      - overlay-battery.conf
      - overlay-rf.conf
      - overlay-bench.conf
      - overlay-node-id-from-key.conf
      - overlay-xeddsa.conf
      - overlay-cluster-sign.conf
      - overlay-xeddsa-sign.conf
      - overlay-cluster-sig-required.conf
      - overlay-led-status.conf
      - overlay-quiet-first-boot.conf
    dtc_overlays: [depot.overlay]
    sysbuild: {BOOT_SIGNATURE_TYPE_ECDSA_P256: true}

  4:
    name: v4-node
    summary: Heltec V4 cluster member
    board: heltec_wifi_lora32_v4/esp32s3/procpu
    board_tag: heltec-v4
    hw_model: 110
    build_dir: build-heltec-v4-f7
    notes: "ble + cluster (healthy V4 member)"
    flasher: esptool
    overlays:
      - overlay-v4-unified.conf
      - overlay-nonet.conf
      - overlay-gnss.conf
      - overlay-pm-off.conf
      - overlay-nomqtt.conf
      - overlay-cluster.conf
      - overlay-ota-ble.conf
      - overlay-ota-ble-secure.conf
      - overlay-v4-member.conf
      - overlay-health.conf
      - overlay-coredump-flash.conf
      - overlay-battery.conf
      - overlay-rf.conf
      - overlay-bench.conf
      - overlay-node-id-from-key.conf
      - overlay-xeddsa.conf
      - overlay-cluster-sign.conf
      - overlay-xeddsa-sign.conf
      - overlay-cluster-sig-required.conf
      - overlay-led-status.conf
      - overlay-quiet-first-boot.conf
    dtc_overlays: [coredump-big.overlay]
    sysbuild: {BOOT_SIGNATURE_TYPE_ECDSA_P256: true}

  5:
