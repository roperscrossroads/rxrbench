  15:
    name: r8-gateway
    summary: Heltec V4-R8 WiFi gateway, a Sparkplug B Edge Node over verified TLS
    board: heltec_wifi_lora32_v4_r8/esp32s3/procpu
    board_tag: heltec-v4r8
    hw_model: 132
    build_dir: build-heltec-v4r8-gateway15
    notes: >-
      The mesh gateway: the V4-R8 on WiFi (no BLE), publishing the nodes it hears as a Sparkplug B
      Edge Node over MQTT with TLS, the broker's certificate and name verified (MESHTASTIC_SPARKPLUG_TLS,
      trust anchor ISRG Root X2). Built from the firmware's sparkplug branch until it is merged (the
      board's `builds` entry names that tree). WiFi credentials and the broker login are
      set on the board's shell (`wifi cred add`, `sparkplug set ...`), never in the image or a layout.
      Observed 2026-11-08: the build's dram0 is 97 % full.
    flasher: esptool
    class_in_recipe: true
    overlays:
      - overlay-v4-unified.conf
      - overlay-nobt.conf
      - overlay-pm-off.conf
      - overlay-mqtt.conf
      - overlay-sparkplug.conf
      - overlay-sparkplug-tls.conf
      - overlay-rf.conf
      - overlay-bench.conf
      - overlay-node-id-from-key.conf
      - overlay-led-status.conf
    sysbuild: {BOOT_SIGNATURE_TYPE_ECDSA_P256: true}
