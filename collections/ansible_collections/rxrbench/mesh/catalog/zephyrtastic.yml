  14:
    name: e290-node
    summary: Heltec Vision Master E290 standalone node (bring-up image)
    board: heltec_vision_master_e290/esp32s3/procpu
    board_tag: heltec-vme290
    hw_model: 68
    build_dir: build-heltec-vme290-node14
    notes: >-
      Heltec Vision Master E290 (ESP32-S3R8, bare SX1262, 2.9" e-ink, no GNSS) as a plain LoRa+BLE node
      with the screen UI over the e-ink driver: the bring-up image, no cluster. Built from the board's own
      branch until it is merged (the catalog's `sources:` names the tree). Mirrors the firmware's fleet
      scenario sample.meshtastic.fleet.e290_ble; change one, change both.
    flasher: esptool
    class_in_recipe: true
    overlays:
      - overlay-v4-unified.conf
      - overlay-nonet.conf
      - overlay-pm-off.conf
      - overlay-nomqtt.conf
      - overlay-rf.conf
      - overlay-bench.conf
