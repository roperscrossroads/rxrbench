    board: heltec_wifi_lora32_v4/esp32s3/procpu
    board_tag: heltec-v4
    hw_model: 110
    build_dir: build-heltec-v4-listener
    notes: "ble + scanner autostart, no cluster, no beacons (listener)"
    flasher: esptool
    overlays:
      - overlay-v4-unified.conf
      - overlay-nonet.conf
      - overlay-gnss.conf
      - overlay-pm-off.conf
      - overlay-nomqtt.conf
      - overlay-ota-ble.conf
      - overlay-ota-ble-secure.conf
      - overlay-scanner.conf
      - overlay-v4-member.conf
      - overlay-v4-listener.conf
      - overlay-health.conf
      - overlay-coredump-flash.conf
      - overlay-battery.conf
      - overlay-rf.conf
      - overlay-bench.conf
    dtc_overlays: [coredump-big.overlay]
    sysbuild: {BOOT_SIGNATURE_TYPE_ECDSA_P256: true}

  6:
    name: r8-node
    summary: Heltec V4-R8 cluster member
    board: heltec_wifi_lora32_v4_r8/esp32s3/procpu
    board_tag: heltec-v4r8
    hw_model: 132
    build_dir: build-heltec-v4r8-member
    notes: "ble + cluster (healthy V4-R8 member)"
    flasher: esptool
    overlays:
      - overlay-v4-unified.conf
      - overlay-nonet.conf
      - overlay-gnss.conf
      - overlay-pm-off.conf
      - overlay-nomqtt.conf
      - overlay-cluster.conf
      - overlay-ota-ble.conf
      - overlay-ota-ble-secure.conf
      - overlay-v4r8-member.conf
      - overlay-health.conf
      - overlay-coredump-flash.conf
      - overlay-battery.conf
      - overlay-rf.conf
      - overlay-bench.conf
      - overlay-node-id-from-key.conf
      - overlay-xeddsa.conf
      - overlay-cluster-sign.conf
      - overlay-xeddsa-sign.conf
      - overlay-cluster-sig-required.conf
      - overlay-led-status.conf
      - overlay-quiet-first-boot.conf
    dtc_overlays: [coredump-big.overlay]
    sysbuild: {BOOT_SIGNATURE_TYPE_ECDSA_P256: true}

  # 7: retired 2026-11-25 (was xiao-node-sig-optional, a XIAO that verified but did not require
  # signed synced config). Class 1 signs since then; the number is never reused.

  8:
    name: r8-scanner
    summary: V4-R8 RF listener; 100000-record PSRAM ring, GNSS clock, no cluster
    board: heltec_wifi_lora32_v4_r8/esp32s3/procpu
    board_tag: heltec-v4r8
    hw_model: 132
    build_dir: build-heltec-v4r8-listener8
    notes: "R8 listener: scanner autostart, 100000-record PSRAM ring, GNSS clock, no cluster"
    flasher: esptool
    overlays:
      - overlay-v4-unified.conf
      - overlay-nonet.conf
      - overlay-gnss.conf
      - overlay-pm-off.conf
      - overlay-nomqtt.conf
      - overlay-ota-ble.conf
      - overlay-ota-ble-secure.conf
      - overlay-coredump-flash.conf
      - overlay-battery.conf
      - overlay-rf.conf
      - overlay-bench.conf
      - overlay-node-id-from-key.conf
      - overlay-xeddsa.conf
      - overlay-scanner.conf
      - overlay-listener.conf
      - overlay-v4r8-listener.conf
      - overlay-led-status.conf
      - overlay-quiet-first-boot.conf
    dtc_overlays: [coredump-big.overlay]
    sysbuild: {BOOT_SIGNATURE_TYPE_ECDSA_P256: true}

