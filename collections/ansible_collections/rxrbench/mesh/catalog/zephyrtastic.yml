    board_tag: xiao
    hw_model: 88
    build_dir: build-xiao-head12
    notes: >-
      XIAO keyless radio HEAD: forwards every heard frame undecoded to its brain over
      the peer link, retunes on request; no keys, no NodeDB, no identity on the air; `meshtastic attach brain
      <id>`
    flasher: uf2
    shield: wio_sx1262_xiao
    class_in_recipe: true
    overlays:
      - overlay-ota-shell.conf
      - overlay-ota-ble.conf
      - overlay-ota-ble-secure.conf
      - overlay-health.conf
      - overlay-rf.conf
      - overlay-bench.conf
      - overlay-ble-peer.conf
      - overlay-led-status.conf
