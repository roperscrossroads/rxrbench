    hw_model: 88
    build_dir: build-xiao-relay10
    notes: "XIAO relay RECEIVING half: class 7 + overlay-relay; relay off at boot, `meshtastic relay dir in`"
    flasher: uf2
    shield: wio_sx1262_xiao
    class_in_recipe: true
    overlays:
      - overlay-ota-shell.conf
      - overlay-ota-ble.conf
      - overlay-ota-ble-secure.conf
      - overlay-health.conf
      - overlay-rf.conf
