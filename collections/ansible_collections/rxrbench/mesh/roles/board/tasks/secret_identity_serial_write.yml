---
# A stock Meshtastic node's escrowed key (`board_escrowed`: id, value), given back through its
# own phone API: on its USB port (resolved by name, guarded, locked) or its network API, as the
# layout's config route says. The node must be the escrow's (a stock id is the device's own),
# and must report the key afterwards.
- name: Give the node its escrowed key (stock Meshtastic)
  rxrbench.mesh.meshtastic_identity:
    apply_allowed: "{{ bench_apply_allowed | default(false) | bool }}"
    board: "{{ bench_board }}"
    action: ensure
    private_key: "{{ board_escrowed.value }}"
    node_id: "{{ board_escrowed.id }}"
    transport: "{{ 'tcp' if board_route.bearer | default('usb') in ['wifi', 'eth'] else 'serial' }}"
    host: "{{ board_route.addr | default(board_route.ip) | default(omit) }}"
    bearer: "{{ board_route.bearer | default(omit) }}"
    device: "{{ bench_devreg | default(omit) }}"
    devreg: "{{ (bench_tools | default({})).devreg | default(omit) }}"
  # the registry the route's address is checked against, as for the config (meshtastic_stock.yml)
  environment: "{{ {'DEVREG_REGISTRY': bench_registry} if (ansible_connection | default('ssh')) == 'local' else {} }}"
  vars:
    board_route: "{{ (bench_routes | default({})).config | default({}) }}"
