---
# The node's escrowed key (`board_escrowed`: id, value), given back through the phone API tunnel.
- name: Give the node its escrowed key (Meshtastic)
  rxrbench.mesh.meshtastic_identity:
    apply_allowed: "{{ bench_apply_allowed | default(false) | bool }}"
    board: "{{ bench_board }}"
    action: ensure
    private_key: "{{ board_escrowed.value }}"
    node_id: "{{ board_escrowed.id }}"
    socket: "{{ bench_socket | default(omit) }}"
