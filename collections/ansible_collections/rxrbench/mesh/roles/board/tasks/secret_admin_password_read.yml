---
# The admin password a layout declares, against the fingerprint the node reports: the
# configuration module in check mode compares them and writes nothing.
- name: Compare the declared admin password
  rxrbench.mesh.meshcore_config:
    families: "{{ bench_families }}"
    board: "{{ bench_board }}"
    family: "{{ bench_family }}"
    socket: "{{ bench_socket | default(omit) }}"
    admin_password: "{{ meshcore.admin_password }}"
  check_mode: true
  register: board_password
  failed_when: false
  no_log: true
  when: meshcore.admin_password is defined

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: admin
      declared: "{{ meshcore.admin_password is defined }}"
      matches: "{{ not (board_password.steps | default([]) | length > 0) }}"
      msg: "{{ board_password.msg | default('') }}"
