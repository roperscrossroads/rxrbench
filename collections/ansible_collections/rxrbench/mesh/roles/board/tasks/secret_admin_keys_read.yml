---
# The admin keys a layout declares (`meshtastic.config.security.admin_key`), against what the
# node holds: the configuration module in check mode compares the two sets and writes nothing.
# They are public keys; what is guarded is that the node obeys exactly the declared admins.
- name: Compare the declared admin keys
  rxrbench.mesh.meshtastic_config:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    security:
      admin_key: "{{ meshtastic.config.security.admin_key }}"
  check_mode: true
  register: board_admin_keys
  failed_when: false
  when: meshtastic.config.security.admin_key is defined

# A managed node that differs is refused by the module, with what differs in `written`: that
# is a difference, not a failed read.
- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ (meshtastic.config.security.admin_key | default([]) | length) ~ ' admin key(s)' }}"
      declared: "{{ meshtastic.config.security.admin_key is defined }}"
      matches: "{{ 'admin_key' not in (board_admin_keys.written.security | default([])) }}"
      msg: "{{ '' if board_admin_keys.written is defined else (board_admin_keys.msg | default('')) }}"
