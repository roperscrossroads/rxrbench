---
# The identity key of a board that runs stock Meshtastic, read over its own phone API on its
# serial port (resolved by name, guarded, locked) or its network API, as the layout's config
# route says, as `board_secret`. An absent board is
# reported by the play, not the end of the run.
- name: Read the node's key (stock Meshtastic)
  rxrbench.mesh.meshtastic_identity:
    board: "{{ bench_board }}"
    transport: "{{ 'tcp' if board_route.bearer | default('usb') in ['wifi', 'eth'] else 'serial' }}"
    host: "{{ board_route.addr | default(board_route.ip) | default(omit) }}"
    bearer: "{{ board_route.bearer | default(omit) }}"
    device: "{{ bench_devreg | default(omit) }}"
    devreg: "{{ (bench_tools | default({})).devreg | default(omit) }}"
  environment: "{{ {'DEVREG_REGISTRY': bench_registry} if (ansible_connection | default('ssh')) == 'local' else {} }}"
  vars:
    board_route: "{{ (bench_routes | default({})).config | default({}) }}"
  register: board_key
  no_log: true
  failed_when: false

- name: The key, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ board_key.node_id | default(none) }}"
      value: "{{ board_key.private_key | default(none) }}"
      fingerprint: "{{ board_key.public_key_fp | default(none) }}"
      msg: "{{ board_key.msg | default('') }}"
  no_log: true
