---
# The node's identity key, read through the phone API tunnel, as `board_secret`. An absent
# board is reported by the play, not the end of the run.
- name: Read the node's key (Meshtastic)
  rxrbench.mesh.meshtastic_identity:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
  register: board_key
  no_log: true
  failed_when: false

- name: The key, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ board_key.node_id | default(none) }}"
      value: "{{ board_key.private_key | default(none) }}"
      fingerprint: "{{ board_key.public_key_fp | default(none) }}"
      msg: "{{ board_key.msg | default('') }}"
  no_log: true
