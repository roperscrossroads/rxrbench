---
# The channel keys a layout declares, against what the node holds: the configuration module in
# check mode compares them by fingerprint and writes nothing. `board_secret.matches` says
# whether every declared channel is as declared.
- name: Compare the declared channels
  rxrbench.mesh.meshtastic_config:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    channels: "{{ meshtastic.channels }}"
  check_mode: true
  register: board_channels
  failed_when: false
  when: meshtastic.channels is defined and (bench_manage_channels | default(true) | bool)

- name: The verdict, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ (meshtastic.channels | default([]) | length) ~ ' channel(s)' }}"
      declared: "{{ meshtastic.channels is defined and (bench_manage_channels | default(true) | bool) }}"
      matches: "{{ not (board_channels.written.channels | default([]) | length > 0) }}"
      msg: "{{ board_channels.msg | default('') }}"
