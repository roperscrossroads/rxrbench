---
# The node's identity key, read from its console (`zephcore key export confirm`), as
# `board_secret`. An absent board is reported by the play, not the end of the run.
- name: Read the node's key (MeshCore)
  rxrbench.mesh.meshcore_identity:
    families: "{{ bench_families }}"
    board: "{{ bench_board }}"
    family: "{{ bench_family }}"
    socket: "{{ bench_socket | default(omit) }}"
  register: board_key
  no_log: true
  failed_when: false

- name: The key, as a secret
  ansible.builtin.set_fact:
    board_secret:
      id: "{{ board_key.node_id | default(none) }}"
      value: "{{ board_key.private_key | default(none) }}"
      fingerprint: "{{ board_key.public_key_fp | default(none) }}"
      msg: "{{ board_key.msg | default('') }}"
  no_log: true
