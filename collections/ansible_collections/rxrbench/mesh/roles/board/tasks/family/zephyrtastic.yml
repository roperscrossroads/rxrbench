---
# A zephyrtastic board's own state, included by its vocabulary's task file after the radio and
# the identity, before the config: the bench LED, the roles it remembers, a hub's workers, a
# listener's presets.

# The bench LED: in use, and what the board is for (bench_led_mode, bench_led_color: the
# family's facts, from `zephyrtastic.led` or its groups). Firmware without the LED is reported
# by the module, not failed.
- name: The bench LED
  rxrbench.mesh.zephyrtastic_led:
    apply_allowed: "{{ bench_apply_allowed | default(false) | bool }}"
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    mode: "{{ bench_led_mode }}"
    color: "{{ bench_led_color }}"
  # In a plan, a board about to get its first flash (or a family switch) does not speak the
  # zephyrtastic shell yet: the LED is set once it is written, like the config below.
  when:
    - bench_led == 'shell'
    - not (ansible_check_mode and (board_flashed.family_switch | default(false)
           or board_flashed.first_flash | default(false)))

# The roles a node remembers across reboots (the BLE peer it dials, its hub, its workers, the
# rx-only worker's peer, the courier's arm, the relay, a pinned list, a cluster document): a plain node
# declares it has none (`zephyrtastic.intents: none`), and what it remembers from an earlier
# layout is forgotten, with the reboot that follows. Before the roles below, which set theirs.
- name: The roles the node remembers
  rxrbench.mesh.zephyrtastic_intents:
    apply_allowed: "{{ bench_apply_allowed | default(false) | bool }}"
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    intents: "{{ zephyrtastic.intents }}"
  when: zephyrtastic.intents is defined

# A hub stores the preset it wants of each worker and puts a worker back on it whenever the
# worker reports another. Each worker's node id is read from the worker itself, through its
# broker. bench_hub_workers is the family's fact: `zephyrtastic.hub.workers`, or the old
# `zephyrtastic.brain.heads`.
- name: The preset the hub wants of each worker
  rxrbench.mesh.zephyrtastic_hub:
    apply_allowed: "{{ bench_apply_allowed | default(false) | bool }}"
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    workers: "{{ bench_hub_workers }}"
    worker_sockets: >-
      {{ dict(bench_hub_workers | list | zip(bench_hub_workers | list | map('extract', hostvars)
              | map(attribute='bench_socket', default=''))) }}
  when: bench_hub_workers | default(none) is not none

- name: The presets the listener sweeps
  rxrbench.mesh.zephyrtastic_scan:
    board: "{{ bench_board }}"
    socket: "{{ bench_socket | default(omit) }}"
    presets: "{{ zephyrtastic.listener.presets }}"
  when: zephyrtastic.listener.presets is defined
