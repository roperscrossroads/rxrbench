---
# The node's escrowed key (`board_escrowed`: id, value), given back through its console.
- name: Give the node its escrowed key (MeshCore)
  rxrbench.mesh.meshcore_identity:
    apply_allowed: "{{ bench_apply_allowed | default(false) | bool }}"
    families: "{{ bench_families }}"
    board: "{{ bench_board }}"
    family: "{{ bench_family }}"
    action: ensure
    private_key: "{{ board_escrowed.value }}"
    node_id: "{{ board_escrowed.id }}"
    socket: "{{ bench_socket | default(omit) }}"
