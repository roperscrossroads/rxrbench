---
# What this plugin needs on a bench host beyond its tools (host/bin) and console rules
# (host/dialects.d): rxrbench.core's roles read this file.

# A venv synced to host/venvs/<name>.txt, and what it must import to be whole. This one is
# the interpreter of this plugin's modules: the phone API tunnel and the stock-firmware probe
# need the `meshtastic` library.
venvs:
  mesh: {imports: [meshtastic, serial, yaml, pyudev]}

# Files fetched once and pinned by sha256, under the bench host's home. The OTAFIX bootloader
# update xiao_otafix.py applies (it checks the sha256 again before it writes).
downloads:
  - url: >-
      https://github.com/meshtastic/Adafruit_nRF52_Bootloader_OTAFIX/releases/download/0.9.2-OTAFIX2.5/update-xiao_nrf52840_ble_sense_bootloader-0.9.2-OTAFIX2.5_nosd.uf2
    sha256: 4a44832efe05ccc458bd9218934bed192aa4bd8a6f6aac5a2b45ec310c8e496d
    dest: rxrbench/firmware/update-xiao_nrf52840_ble_sense_bootloader-0.9.2-OTAFIX2.5_nosd.uf2
