# antsibull-docs' configuration for the collections' reference site (tools/docs.py).
breadcrumbs = true
indexes = true
use_html_blobs = false
add_antsibull_docs_version = true

# The collections are not on Galaxy: they are directories of the repository.
collection_url = {
  * = "https://github.com/roperscrossroads/rxrbench/tree/main/collections/ansible_collections/{namespace}/{name}"
}
collection_install = {
  * = "ansible-galaxy collection install 'git+https://github.com/roperscrossroads/rxrbench.git#/collections/ansible_collections/{namespace}/{name}'"
}
